name: RMM App Portal Draft Recovery
on:
  push:
    paths:
      - 'apps/rmm/**'
      - 'services/api/src/appPortalIcon.js'
      - 'services/api/src/appPortalInventory.js'
      - 'services/api/src/rmmAppPortal.js'
      - 'services/api/test/app-portal-simple-flow.mjs'
      - '.github/workflows/rmm-app-portal-drafts.yml'
  pull_request:
    paths:
      - 'apps/rmm/**'
      - 'services/api/src/appPortalIcon.js'
      - 'services/api/src/appPortalInventory.js'
      - 'services/api/src/rmmAppPortal.js'
      - 'services/api/test/app-portal-simple-flow.mjs'
      - '.github/workflows/rmm-app-portal-drafts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/rmm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/rmm/package-lock.json
      - run: npm ci
      - name: Test draft restoration, fingerprints and upload retry
        run: node --test tests/app-portal-drafts.test.mjs
      - name: Test logo validation and inventory auto-detection
        run: node --test ../../services/api/test/app-portal-simple-flow.mjs
      - name: Check API route source syntax
        run: node --check ../../services/api/src/rmmAppPortal.js
      - name: Build RMM frontend
        run: npm run build
