name: Release approval guidance pilot (testing tenant only)
on:
  push:
    branches: [fix/config-pilot-promotion-guidance-20261011]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: apps/itsm}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/itsm/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Generate matching immutable release manifest
        run: node .github/scripts/generate-release-manifest.mjs
        working-directory: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/itsm
          push: true
          tags: ghcr.io/dansut24/hi5central-platform-itsm:config-pilot-help-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=testing-tenant-release-approval-guidance
