name: Production approval - testing AI pilot
run-name: Production pilot approval · ${{ inputs.tenant_slug }} · ${{ inputs.build_sha }}
on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: 'Only the authorised pilot tenant can be approved'
        required: true
        type: string
        default: testing
      build_sha:
        description: 'Immutable exact Git commit and GHCR image revision'
        required: true
        type: string
        default: edfc90c119ce57695012e72fe7d3ea5dbbcb1839
permissions:
  contents: read
  packages: read
concurrency:
  group: hi5-production-testing-ai-pilot
  cancel-in-progress: false
jobs:
  verify-approved-artifact:
    name: Approve and verify pinned testing-only release
    # CAUTION: repository administrator MUST enable required reviewers for
    # the production environment; environment naming alone is not protection.
    environment:
      name: production
    runs-on: ubuntu-24.04
    steps:
      - name: Verify immutable target and explicit pilot scope
        env:
          EXPECTED_SHA: edfc90c119ce57695012e72fe7d3ea5dbbcb1839
          BUILD_SHA: ${{ inputs.build_sha }}
          TENANT_SLUG: ${{ inputs.tenant_slug }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TENANT_SLUG" = testing
          test "$BUILD_SHA" = "$EXPECTED_SHA"
          test "${GITHUB_REF_NAME}" = release/ai-unified-tenant-gated-20261011
          echo "Exact approved branch, tenant and release revision checked."
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_sha }}
          persist-credentials: false
      - name: Verify checked-out artifact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.build_sha }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check API and ITSM images exist at expected revision
        shell: bash
        run: |
          set -euo pipefail
          for kind in api itsm; do
            docker buildx imagetools inspect "ghcr.io/dansut24/hi5central-platform-${kind}:unified-ai-release-${{ inputs.build_sha }}" >/dev/null
            echo "Image present: ${kind}"
          done
      - name: Emit operator handoff information - NO deployment
        shell: bash
        run: |
          {
            echo 'Production environment approval workflow passed.'
            echo 'No VPS deployment was performed by this job.'
            echo 'Tenant: testing'
            echo 'Release: edfc90c119ce57695012e72fe7d3ea5dbbcb1839'
            echo 'Operator must still validate VPS routing, rollback plan, live user approval and post-deploy proof before enabling configuration promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
