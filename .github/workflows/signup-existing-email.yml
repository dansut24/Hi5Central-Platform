name: Signup Existing Identity Regression
on:
  pull_request:
    paths:
      - 'services/api/src/index.js'
      - 'services/api/test/multitenant-signup-smoke.mjs'
      - '.github/workflows/signup-existing-email.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signup-regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hi5_signup_ci
          POSTGRES_USER: hi5_signup_ci
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hi5_signup_ci -d hi5_signup_ci"
          --health-interval 5s --health-timeout 4s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      DATABASE_URL: postgresql://hi5_signup_ci:ci_only_password@localhost:5432/hi5_signup_ci
      REDIS_URL: redis://localhost:6379/0
      BACKGROUND_WORKERS_ENABLED: 'false'
      DEPLOYMENT_MODE: managed
      TENANCY_MODE: multi
      ROOT_DOMAIN: hi5central.com
      API_URL: http://127.0.0.1:3001
      MARKETING_URL: https://hi5central.com
      NODE_ENV: test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1'
      SMTP_USER: ci-test@example.invalid
      SMTP_PASSWORD: ci-only-placeholder
      MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      RMM_RECOVERY_KEY_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      TENANT_INSTALLER_HMAC_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - name: Check server syntax
        run: node --check src/index.js
      - name: Migrate isolated test database
        run: npm run migrate
      - name: Start API without background workers
        run: |
          node src/index.js > /tmp/hi5-signup-api-test.log 2>&1 &
          echo $! > /tmp/hi5-signup-api-test.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/live >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -60 /tmp/hi5-signup-api-test.log
          exit 1
      - name: Multi-tenant signup security regression
        run: node test/multitenant-signup-smoke.mjs
      - name: Show API log on failure
        if: failure()
        run: tail -70 /tmp/hi5-signup-api-test.log 2>/dev/null || true
