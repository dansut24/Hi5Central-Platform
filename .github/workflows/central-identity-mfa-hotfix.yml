name: Stage central identity MFA compatibility (no deployment)
on:
  push:
    branches: [hotfix/central-identity-uat-mfa-20261011]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/mfa.js
      - run: node --check src/securityPolicy.js
      - run: node test/environment-login-mfa.mjs
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ghcr.io/dansut24/hi5central-platform-api:central-mfa-staged-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=central-mfa-compatibility-staged-not-production
