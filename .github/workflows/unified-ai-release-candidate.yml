name: Develop - Consolidated AI and tenant release proof
on:
  push:
    branches: [release/ai-unified-tenant-gated-20261011]
permissions:
  contents: read
  packages: write
jobs:
  verify-api:
    environment: develop
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hi5_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: hi5_unified_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hi5_ci -d hi5_unified_ci"
          --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      DATABASE_URL: postgresql://hi5_ci:ci_only_password@localhost:5432/hi5_unified_ci
      REDIS_URL: redis://localhost:6379
      DEPLOYMENT_MODE: managed
      TENANCY_MODE: multi
      ROOT_DOMAIN: hi5central.com
      RUNTIME_ENVIRONMENT: live
      BACKGROUND_WORKERS_ENABLED: 'false'
      NODE_ENV: test
      CONFIGURATION_RELEASE_AI_APPROVED_BUILD_SHA: 9fb2fb5dba0516add7b2bea7cbb52554a7224ebf
    defaults:
      run: {working-directory: services/api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/itsmAiAssist.js && node --check src/configurationRelease.js && node --check src/tenantDeploymentProof.js && node --check src/organisation.js && node --check src/index.js
      - run: node test/itsm-ai-assist.mjs
      - run: node test/ai-release-gate.mjs
      - run: node test/tenant-deployment-proof.mjs
      - run: npm run migrate
      - name: Verify scoped tenant proof table and acceptance history
        run: |
          node --input-type=module -e "
            import pg from 'pg';
            const c=new pg.Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            const r=await c.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('tenant_application_deployment_proofs','tenant_ai_release_acceptance_history','tenant_ai_release_acceptances')\");
            console.log('TENANT_RELEASE_TABLES',r.rows.map(x=>x.table_name));
            if(r.rowCount!==3)process.exitCode=5;
            await c.end();"
      - run: npm run build:runtime
  verify-ui:
    environment: develop
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: apps/itsm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/itsm/package-lock.json
      - run: npm ci
      - run: node test/release-tracking-layout.mjs
      - run: npm run build
  package:
    needs: [verify-api,verify-ui]
    environment: develop
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: api
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - kind: itsm
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:unified-ai-release-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.release.source=develop
            com.hi5central.release.purpose=single-artifact-pilot-test-uat
