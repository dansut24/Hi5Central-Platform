name: Isolated shared master-data read pilot
on:
  push:
    branches: [feature/shared-master-data-uat-20261011]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: services/api}
    env:
      DATABASE_URL: postgresql://ignored:ignored@localhost:5432/ignored
      RUNTIME_ENVIRONMENT: uat
      BACKGROUND_WORKERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/organisation.js && node --check src/index.js
      - run: npm run build:runtime
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ghcr.io/dansut24/hi5central-platform-api:shared-master-uat-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=testing-tenant-read-only-master-pilot
