name: Reviewed UAT to Production Promotion
on:
  pull_request:
    paths:
      - 'services/api/src/uatProductionPromotion.js'
      - 'services/api/src/applicationReleaseExecutor.js'
      - 'services/api/src/releaseOperator.js'
      - 'services/api/migrations/platform-admin/155_app_release_executor_heartbeat.sql'
      - 'services/api/src/platformAdmin.js'
      - 'services/api/test/uat-production-promotion.mjs'
      - 'apps/admin/src/features/admin/PlatformAdminApp.jsx'
      - 'apps/admin/src/features/admin/UatProductionPromotion.jsx'
      - 'apps/admin/src/features/admin/UatProductionPromotion.css'
      - '.github/workflows/uat-production-promotion.yml'
      - 'deployment/qa26/managed-vps-app-release-executor.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and run fail-closed release gate regression
        run: |
          node --check src/uatProductionPromotion.js
          node --check src/applicationReleaseExecutor.js
          node --check src/releaseOperator.js
          node --check src/platformAdmin.js
          node --test test/uat-production-promotion.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime
  native-app-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native operator source without Docker privileges
        run: |
          python -m py_compile deployment/qa26/managed-vps-app-release-executor.py
          python deployment/qa26/managed-vps-app-release-executor.py --help
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
