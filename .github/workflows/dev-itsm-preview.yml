name: Dev ITSM preview

# One-time publish when this workflow is introduced, or explicitly re-run
# from Actions. Ordinary pushes to develop do not trigger image builds.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/dev-itsm-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hi5central-dev-itsm-preview
  cancel-in-progress: true

jobs:
  build-itsm:
    name: Build and publish Dev ITSM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/itsm
          push: true
          tags: |
            ghcr.io/dansut24/hi5central-platform-itsm:dev
            ghcr.io/dansut24/hi5central-platform-itsm:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dansut24/Hi5Central-Platform
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ITSM
          cache-to: type=gha,mode=max,scope=ITSM
