name: QA26 PR69 Pinned Candidate Images
on:
  pull_request:
    paths:
      - '.github/workflows/qa26-pr69-candidate-images.yml'
      - 'services/api/src/**'
      - 'services/api/migrations/**'
      - 'apps/itsm/src/**'
      - 'apps/itsm/Dockerfile'
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  candidates:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 69 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/qa26-shared-identity-itil-config-ledger-20261014' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - name: itsm
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
    steps:
      - name: Check out reviewed PR69 head commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "Building isolated QA26 candidate from reviewed commit"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated QA-only image tag
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:qa26-pr69-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=qa26-pr69-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=qa26-pr69-${{ matrix.name }}
