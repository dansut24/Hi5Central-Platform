name: Production-owned legal identity guard
on:
  push:
    branches: [fix/production-owned-legal-company-identity-20261011]
  pull_request:
    paths:
      - 'services/api/src/masterLegalIdentity.js'
      - 'services/api/src/settings.js'
      - 'services/api/src/securityPolicy.js'
      - 'services/api/src/sandboxCredentialLogin.js'
      - 'services/api/src/mfa.js'
      - 'services/api/test/sandbox-mfa-stepup.mjs'
      - 'services/api/src/totpIdentity.js'
      - 'services/api/src/runtimePoolTenantGuard.js'
      - 'services/api/test/runtime-pool-mfa-boundary.mjs'
      - 'services/api/src/mfaRecovery.js'
      - 'services/api/src/mfaRecoveryPages.js'
      - 'services/api/src/mailer.js'
      - 'services/api/test/mfa-owner-recovery.mjs'
      - 'services/api/test/totp-issuer-identity.mjs'
      - 'apps/itsm/src/production/ProductionMfaEnrollmentModal.jsx'
      - 'apps/itsm/src/production/ProductionMfaEnrollmentModal.css'
      - 'apps/itsm/src/production/ProductionWorkspaceBootstrap.jsx'
      - 'services/api/test/master-legal-identity.mjs'
      - 'apps/itsm/src/features/settings/ProductionSettingsWorkspace.jsx'
permissions: {contents: read}
jobs:
  api:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://ci-only:ci-only@127.0.0.1:5432/ci-only
      REDIS_URL: redis://127.0.0.1:6379
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/masterLegalIdentity.js && node --check src/settings.js && node --check src/securityPolicy.js && node --check src/sandboxCredentialLogin.js && node --check src/mfa.js
      - run: node test/master-legal-identity.mjs && node test/sandbox-mfa-stepup.mjs && node test/totp-issuer-identity.mjs && node test/runtime-pool-mfa-boundary.mjs && node test/mfa-owner-recovery.mjs
      - run: npm run build:runtime
  itsm:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/itsm}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/itsm/package-lock.json
      - run: npm ci
      - run: npm run build
