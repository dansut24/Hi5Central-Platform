name: Bootstrap Monorepo
# One-time source import for the unified platform repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-monorepo.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-monorepo.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Import current platform sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps services .import
          mkdir -p apps services .import

          git clone --depth=1 --branch main https://github.com/dansut24/hi5central-itsm.git .import/itsm
          git clone --depth=1 --branch main https://github.com/dansut24/hi5central-rmm.git .import/rmm
          git clone --depth=1 --branch main https://github.com/dansut24/hi5central-admin.git .import/admin
          git clone --depth=1 --branch main https://github.com/dansut24/hi5central-control-server.git .import/api

          ITSM_SHA="$(git -C .import/itsm rev-parse HEAD)"
          RMM_SHA="$(git -C .import/rmm rev-parse HEAD)"
          ADMIN_SHA="$(git -C .import/admin rev-parse HEAD)"
          API_SHA="$(git -C .import/api rev-parse HEAD)"

          rm -rf .import/itsm/.git .import/rmm/.git .import/admin/.git .import/api/.git
          rm -rf .import/itsm/.github .import/rmm/.github .import/admin/.github .import/api/.github

          mkdir -p apps/itsm apps/rmm apps/admin services/api
          cp -a .import/itsm/. apps/itsm/
          cp -a .import/rmm/. apps/rmm/
          cp -a .import/admin/. apps/admin/
          cp -a .import/api/. services/api/
          rm -rf .import

          cat > MIGRATION.md <<EOF
          # Monorepo migration baseline

          Imported from the reconciled production/development baseline on 2026-10-05.

          | Component | Source repository | Source commit |
          | --- | --- | --- |
          | ITSM | dansut24/hi5central-itsm | \`$ITSM_SHA\` |
          | RMM | dansut24/hi5central-rmm | \`$RMM_SHA\` |
          | Admin | dansut24/hi5central-admin | \`$ADMIN_SHA\` |
          | API | dansut24/hi5central-control-server | \`$API_SHA\` |

          The original repositories remain available as migration history. New platform development moves to this repository.
          EOF

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hi5Central CI"
          git config user.email "ci@hi5central.com"
          git add apps services MIGRATION.md
          git commit -m "Import reconciled Hi5Central platform source"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push origin "HEAD:${{ github.ref_name }}"
          fi
