name: Stage Windows self-host deployment assets

on:
  push:
    branches:
      - stage/windows-selfhost-test
    paths:
      - .github/workflows/stage-windows-selfhost-test.yml

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download green Windows deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: Hi5Central-Windows-Tenant-Template
          path: windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37363163284

      - name: Prepare Windows-only overlay image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image/templates
          cp windows/Hi5CentralAgentTemplate.exe image/templates/
          cp windows/Hi5CentralAgentTemplate.msi image/templates/
          cat > image/Dockerfile <<'EOF'
          FROM ghcr.io/dansut24/hi5central-agent-deployment-assets:dev
          COPY templates/ /assets/templates/
          EOF
          ls -lh image/templates

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows test asset image
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ghcr.io/dansut24/hi5central-agent-deployment-assets:dev-windows-test
          labels: |
            org.opencontainers.image.revision=5ba11c5bca444b655dcdc7962d12f3c877d0b4e7
            org.opencontainers.image.description=Temporary Windows self-host acceptance image
