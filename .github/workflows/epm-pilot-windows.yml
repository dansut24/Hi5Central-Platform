name: Hi5Central EPM Windows pilot
on:
  workflow_dispatch:
  push:
    branches: [feature/epm-file-elevation-pilot-20261114]
    paths:
      - 'native/epm/**'
      - '.github/workflows/epm-pilot-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native/epm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and compile
        run: |
          dotnet restore Hi5Central.EpmPilot/Hi5Central.EpmPilot.csproj
          dotnet build Hi5Central.EpmPilot/Hi5Central.EpmPilot.csproj -c Release --no-restore
      - name: Windows fail-closed self-test
        shell: pwsh
        run: |
          & dotnet run --project Hi5Central.EpmPilot/Hi5Central.EpmPilot.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'EPM self-test failed' }
      - name: Publish test binary
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hi5-epm-pilot'
          dotnet publish Hi5Central.EpmPilot/Hi5Central.EpmPilot.csproj -c Release -r win-x64 --self-contained true -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'EPM publish failed' }
          $exe=Join-Path $out 'Hi5CentralEpmPilot.exe'
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash
          "SHA256: $hash" | Set-Content (Join-Path $out 'SHA256.txt')
          Write-Host "EPM Windows pilot SHA256 $hash"
      - name: Read-only Windows elevation coverage report
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hi5-epm-pilot'
          $exe = Join-Path $out 'Hi5CentralEpmPilot.exe'
          $json = Join-Path $env:RUNNER_TEMP 'epm-coverage-report.json'
          $process = Start-Process -FilePath $exe -ArgumentList '--coverage-report' -PassThru -Wait -RedirectStandardOutput $json
          if ($process.ExitCode -ne 0) { throw 'Coverage probe failed' }
          $report = Get-Content -LiteralPath $json -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 'hi5central-epm-coverage-v1' -or $report.coverage.Count -lt 9) {
            throw 'Missing typed EPM operation coverage report'
          }
          $unbound = $report.coverage | Where-Object scenario -eq 'unmanaged_native_uac'
          if ($unbound.automaticTarget -ne $false -or $unbound.executionWorker -ne $false) {
            throw 'Native UAC was falsely reported as universally supported'
          }
          $msi = $report.coverage | Where-Object scenario -eq 'windows_installer_msi'
          if ($msi.executionWorker -ne $false) { throw 'Unqualified MSI worker falsely reported as ready' }
          Write-Host 'PASS: read-only Windows capabilities report and honest unsupported-operation statuses.'
      - name: Install and uninstall broker on isolated Windows CI runner
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hi5-epm-pilot'
          $exe = Join-Path $out 'Hi5CentralEpmPilot.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash
          try {
            ./Install-EpmPilot.ps1 -Executable $exe -ExpectedSha256 $sha
            $service = Get-Service Hi5CentralEpmPilot -ErrorAction Stop
            if ($service.Status -ne 'Running') { throw 'EPM service was not running' }
            $shellVerb = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\exefile\shell\Hi5CentralElevate'
            if (-not (Test-Path $shellVerb)) { throw 'EPM Explorer context-menu entry was not installed' }
            Write-Host 'PASS: broker service running and Explorer integration installed'
          } finally {
            ./Uninstall-EpmPilot.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-EPM-Windows-Pilot
          path: ${{ runner.temp }}/hi5-epm-pilot/**
          if-no-files-found: error
          retention-days: 14
