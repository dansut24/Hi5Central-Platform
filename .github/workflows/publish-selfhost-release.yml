name: Publish Self-Hosted Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact tested platform commit SHA to publish'
        required: true
        type: string
      version:
        description: 'Semantic version, for example v1.4.0 or v1.4.0-rc.1'
        required: true
        type: string
      channel:
        description: 'Self-host update channel'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - early-access

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-release
  cancel-in-progress: false

env:
  PLATFORM_API_IMAGE: ghcr.io/dansut24/hi5central-platform-api
  PLATFORM_ITSM_IMAGE: ghcr.io/dansut24/hi5central-platform-itsm
  PLATFORM_RMM_IMAGE: ghcr.io/dansut24/hi5central-platform-rmm
  PLATFORM_ADMIN_IMAGE: ghcr.io/dansut24/hi5central-platform-admin

jobs:
  publish:
    name: Publish ${{ inputs.version }} to ${{ inputs.channel }}
    runs-on: ubuntu-latest
    environment:
      name: Self-Hosted Release
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must look like v1.4.0 or v1.4.0-rc.1" >&2
            exit 1
          }
          if [[ "${{ inputs.channel }}" == "stable" && ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases must use a final semantic version such as v1.4.0." >&2
            exit 1
          fi
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "commit_sha must be a full 40-character Git SHA" >&2
            exit 1
          }

      - name: Verify immutable images exist
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            echo "Checking $image:sha-$COMMIT_SHA"
            docker buildx imagetools inspect "$image:sha-$COMMIT_SHA" >/dev/null
          done

      - name: Require Stable to match current Production
        if: inputs.channel == 'stable'
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            prod_manifest=$(docker buildx imagetools inspect "$image:prod" --raw | sha256sum | awk '{print $1}')
            candidate_manifest=$(docker buildx imagetools inspect "$image:sha-$COMMIT_SHA" --raw | sha256sum | awk '{print $1}')
            if [[ "$prod_manifest" != "$candidate_manifest" ]]; then
              echo "$image:sha-$COMMIT_SHA is not the image currently promoted to Production." >&2
              exit 1
            fi
          done
          echo "Stable candidate exactly matches the current Production image set."

      - name: Publish exact tested image set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            docker buildx imagetools create \
              -t "$image:$VERSION" \
              -t "$image:$CHANNEL" \
              "$image:sha-$COMMIT_SHA"
          done
          echo "Published $VERSION from immutable SHA $COMMIT_SHA to channel $CHANNEL."
          echo "No images were rebuilt."
