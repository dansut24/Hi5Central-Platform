name: Marketing PR83 — isolated preview image

on:
  push:
    branches:
      - feat/marketing-premium-website-20261017
    paths:
      - 'apps/itsm/**'
      - 'scripts/verify-marketing-preview.mjs'
      - '.github/workflows/marketing-preview-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: hi5-marketing-pr83-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify preview-only routing and production preservation
        run: node scripts/verify-marketing-preview.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR for preview image only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish separate immutable marketing preview image (never Production)
        uses: docker/build-push-action@v6
        with:
          context: apps/itsm
          push: true
          tags: ghcr.io/dansut24/hi5central-marketing-preview:pr83-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=isolated-marketing-review
          cache-from: type=gha,scope=marketing-pr83
          cache-to: type=gha,mode=max,scope=marketing-pr83
