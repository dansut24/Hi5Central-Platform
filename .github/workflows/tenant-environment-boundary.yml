name: ITSM environment and single-live RMM boundary
on:
  pull_request:
    paths:
      - 'services/api/src/tenantEnvironmentPolicy.js'
      - 'services/api/src/sandboxRmmBoundary.js'
      - 'services/api/scripts/qa26-readiness.mjs'
      - 'docs/qa26-test-activation-runbook.md'
      - 'services/api/test/sandbox-rmm-boundary.mjs'
      - 'services/api/src/index.js'
      - 'services/api/src/liveDirectoryBridge.js'
      - 'services/api/src/qa26Staging.js'
      - 'services/api/test/qa26-preview-boundary.mjs'
      - 'services/api/src/organisation.js'
      - 'services/api/src/rmmRemote.js'
      - 'services/api/src/rmmConnect.js'
      - 'services/api/test/shared-live-directory.mjs'
      - 'services/api/src/tenantEnvironmentProvisioner.js'
      - 'services/api/src/tenantEnvironmentAccess.js'
      - 'services/api/src/tenantRelease.js'
      - 'services/api/test/tenant-environment-boundary.mjs'
      - 'services/api/src/itsmConfigurationChanges.js'
      - 'services/api/src/itsmAuditValueDisplay.js'
      - 'services/api/src/uatSelectiveConfiguration.js'
      - 'services/api/src/uatConfigurationPromotionRoutes.js'
      - 'services/api/migrations/itsm/157_itsm_configuration_promotions.sql'
      - 'services/api/test/uat-selective-configuration.mjs'
      - 'services/api/migrations/itsm/156_itsm_configuration_audit_value_summaries.sql'
      - 'services/api/test/itsm-audit-value-summaries.mjs test/uat-selective-configuration.mjs'
      - 'services/api/src/settings.js'
      - 'services/api/migrations/itsm/154_itsm_configuration_change_events.sql'
      - 'services/api/test/itsm-configuration-history.mjs'
      - 'services/api/test/itsm-leaf-settings.mjs'
      - 'apps/itsm/src/features/settings/ItsmConfigurationHistory.jsx'
      - 'apps/itsm/src/features/settings/itsmAuditDescriptions.js'
      - 'apps/itsm/src/features/settings/itsmAuditDescriptions.test.mjs'
      - 'apps/itsm/src/features/settings/ProductionSettingsWorkspace.jsx'
      - 'apps/itsm/src/features/settings/itsmSettingsDelta.js'
      - 'apps/itsm/src/features/settings/itsmSettingsDelta.test.mjs'
      - 'apps/itsm/src/features/settings/ProductionReleaseManagement.jsx'
      - 'apps/itsm/src/features/settings/UatSelectiveConfigurationPromotion.jsx'
      - 'apps/itsm/src/features/settings/UatSelectiveConfigurationPromotion.css'
      - '.github/workflows/tenant-environment-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/tenantEnvironmentPolicy.js && node --check src/tenantEnvironmentProvisioner.js && node --check src/tenantEnvironmentAccess.js && node --check src/tenantRelease.js
      - run: node --check scripts/qa26-readiness.mjs
      - run: node --check src/uatSelectiveConfiguration.js && node --check src/uatConfigurationPromotionRoutes.js && node --check src/itsmConfigurationChanges.js && node --check src/itsmAuditValueDisplay.js && node --check src/settings.js && node --check src/liveDirectoryBridge.js && node --check src/qa26Staging.js && node --check src/organisation.js && node --check src/rmmRemote.js && node --check src/rmmConnect.js && node --check src/sandboxRmmBoundary.js && node --check src/index.js
      - run: node --test test/tenant-environment-boundary.mjs test/itsm-configuration-history.mjs test/itsm-leaf-settings.mjs test/itsm-audit-value-summaries.mjs test/shared-live-directory.mjs test/sandbox-rmm-boundary.mjs test/qa26-preview-boundary.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime
  itsm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/itsm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test src/features/settings/itsmSettingsDelta.test.mjs src/features/settings/itsmAuditDescriptions.test.mjs
      - run: npm run build
