name: Platform Containers

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - '.github/workflows/platform-containers.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - '.github/workflows/platform-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_API_IMAGE: ghcr.io/dansut24/hi5central-platform-api
  PLATFORM_ITSM_IMAGE: ghcr.io/dansut24/hi5central-platform-itsm
  PLATFORM_RMM_IMAGE: ghcr.io/dansut24/hi5central-platform-rmm
  PLATFORM_ADMIN_IMAGE: ghcr.io/dansut24/hi5central-platform-admin

jobs:
  containers:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - name: ITSM
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
          - name: RMM
            context: apps/rmm
            image: ghcr.io/dansut24/hi5central-platform-rmm
          - name: Admin
            context: apps/admin
            image: ghcr.io/dansut24/hi5central-platform-admin
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant environment hostnames
        if: matrix.name == 'API'
        run: node --test services/api/tests/tenantEnvironmentHostnames.test.mjs
      - name: Validate customer environment frontend routing
        if: matrix.name == 'ITSM'
        run: node --test apps/itsm/tests/tenantSurfaceEnvironments.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  dev:
    name: Dev release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Dev
      url: https://dev.hi5central.com
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote synchronized Dev image set
        shell: bash
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            docker buildx imagetools create -t "$image:dev" "$image:sha-${GITHUB_SHA}"
          done
          echo "Hi5Central Dev release ${GITHUB_SHA} promoted as one platform set."

  production:
    name: Production release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://hi5central.com
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote synchronized Production image set
        shell: bash
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            docker buildx imagetools create -t "$image:prod" -t "$image:latest" "$image:sha-${GITHUB_SHA}"
          done
          echo "Hi5Central Production release ${GITHUB_SHA} promoted as one platform set."
