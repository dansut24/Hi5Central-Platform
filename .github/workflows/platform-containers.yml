name: Platform Containers

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - '.github/workflows/platform-containers.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - '.github/workflows/platform-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_API_IMAGE: ghcr.io/dansut24/hi5central-platform-api
  PLATFORM_ITSM_IMAGE: ghcr.io/dansut24/hi5central-platform-itsm
  PLATFORM_RMM_IMAGE: ghcr.io/dansut24/hi5central-platform-rmm
  PLATFORM_ADMIN_IMAGE: ghcr.io/dansut24/hi5central-platform-admin

jobs:
  containers:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - name: ITSM
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
          - name: RMM
            context: apps/rmm
            image: ghcr.io/dansut24/hi5central-platform-rmm
          - name: Admin
            context: apps/admin
            image: ghcr.io/dansut24/hi5central-platform-admin
    steps:
      - uses: actions/checkout@v4
      - name: Validate sandbox invitation endpoint module syntax
        if: matrix.name == 'API'
        run: node --check services/api/src/managedSandboxInvitationRoutes.js
      - name: Verify initial-owner operator syntax
        if: matrix.name == 'API'
        run: node --check services/api/scripts/tenant-environment-owner-invite.mjs
      - name: Verify two-person activation operator syntax
        if: matrix.name == 'API'
        run: node --check services/api/scripts/tenant-environment-activate.mjs
      - name: Check managed UAT/Test deployment isolation blueprint
        if: matrix.name == 'API'
        run: |
          node --test infrastructure/managed-sandbox/validate.test.mjs infrastructure/managed-sandbox/plan-routes.test.mjs infrastructure/managed-sandbox/reconcile-legacy.test.mjs infrastructure/managed-sandbox/edge-networks.test.mjs infrastructure/managed-sandbox/public-route-audit.test.mjs infrastructure/managed-sandbox/public-ingress-deny.test.mjs
          node --check infrastructure/managed-sandbox/inventory-legacy.mjs
          node --check infrastructure/managed-sandbox/prepare-empty-edges.mjs
          node --check infrastructure/managed-sandbox/probe-edge-isolation.mjs
          node --check infrastructure/managed-sandbox/synthetic-runtime-smoke.mjs
          node --check infrastructure/managed-sandbox/synthetic-customer-lifecycle.mjs
          node --check infrastructure/managed-sandbox/public-route-audit.mjs
          HI5_PHASE10_SMOKE=true node infrastructure/managed-sandbox/test-compose.mjs
      - name: Verify isolated tenant provisioning operator syntax
        if: matrix.name == 'API'
        run: node --check services/api/scripts/tenant-environment-prepare.mjs
      - name: Validate isolated sandbox HTTP lifecycle test driver syntax
        if: matrix.name == 'API'
        run: node --check services/api/scripts/test-sandbox-lifecycle-http.mjs
      - name: Validate isolated provisioning and lifecycle integration test syntax
        if: matrix.name == 'API'
        run: node --check services/api/scripts/test-tenant-environment-prepare-integration.mjs
      - name: Validate tenant environment hostnames
        if: matrix.name == 'API'
        run: node --test services/api/tests/tenantEnvironmentHostnames.test.mjs services/api/tests/tenantEnvironmentProvisioning.test.mjs services/api/tests/managedEnvironmentIsolation.test.mjs services/api/tests/tenantEnvironmentOperatorChecks.test.mjs services/api/tests/tenantEnvironmentBootstrap.test.mjs services/api/tests/managedRuntimeGuard.test.mjs services/api/tests/managedSandboxAccess.test.mjs services/api/tests/managedSandboxInvitations.test.mjs services/api/tests/managedSandboxActivation.test.mjs services/api/tests/managedSandboxPolicy.test.mjs services/api/tests/sandboxDeploymentConfig.test.mjs services/api/tests/secureLoginSurface.test.mjs services/api/tests/sandboxInvitationLanding.test.mjs
      - name: Integration test sandbox identity preparation in disposable PostgreSQL
        if: matrix.name == 'API'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name hi5-ephemeral-provisioning-pg \
            --publish 127.0.0.1:55437:5432 \
            --env POSTGRES_PASSWORD=hi5-ephemeral-ci-only \
            public.ecr.aws/docker/library/postgres:17-alpine
          docker run --detach --name hi5-ephemeral-uat-redis \
            --publish 127.0.0.1:55438:6379 \
            public.ecr.aws/docker/library/redis:8-alpine
          docker run --detach --name hi5-ephemeral-test-redis \
            --publish 127.0.0.1:55439:6379 \
            public.ecr.aws/docker/library/redis:8-alpine
          trap 'docker rm --force hi5-ephemeral-provisioning-pg hi5-ephemeral-uat-redis hi5-ephemeral-test-redis >/dev/null 2>&1 || true' EXIT
          for attempt in {1..40}; do
            if docker exec hi5-ephemeral-provisioning-pg pg_isready --username postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec hi5-ephemeral-provisioning-pg pg_isready --username postgres
          for attempt in {1..40}; do
            if docker exec hi5-ephemeral-uat-redis redis-cli ping 2>/dev/null | grep -qx PONG \
              && docker exec hi5-ephemeral-test-redis redis-cli ping 2>/dev/null | grep -qx PONG; then
              break
            fi
            sleep 1
          done
          docker exec hi5-ephemeral-uat-redis redis-cli ping | grep -qx PONG
          docker exec hi5-ephemeral-test-redis redis-cli ping | grep -qx PONG
          (cd services/api && npm ci --omit=dev)
          HI5_PROVISIONING_TEST_SCOPE=isolated-github-actions \
          HI5_EPHEMERAL_PG_URL=postgresql://postgres:hi5-ephemeral-ci-only@127.0.0.1:55437/postgres \
            node --test services/api/scripts/test-tenant-environment-prepare-integration.mjs
      - name: Validate customer environment frontend routing
        if: matrix.name == 'ITSM'
        run: node --test apps/itsm/tests/tenantSurfaceEnvironments.test.mjs apps/itsm/tests/runtimeEntrypointSandbox.test.mjs apps/itsm/tests/deploymentConfigSandbox.test.mjs
      - name: Use built-in Docker builder without Docker Hub bootstrap
        run: |
          docker buildx use default
          docker buildx inspect default
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          builder: default
          # Native builder avoids moby/buildkit pulls. Classic Docker image
          # storage does not support GitHub cache or provenance exports.
          provenance: false
          sbom: false

  dev:
    name: Dev release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Dev
      url: https://dev.hi5central.com
    steps:
      - name: Use built-in Docker builder without Docker Hub bootstrap
        run: |
          docker buildx use default
          docker buildx inspect default
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote synchronized Dev image set
        shell: bash
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            docker buildx imagetools create -t "$image:dev" "$image:sha-${GITHUB_SHA}"
          done
          echo "Hi5Central Dev release ${GITHUB_SHA} promoted as one platform set."

  production:
    name: Production release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://hi5central.com
    steps:
      - name: Use built-in Docker builder without Docker Hub bootstrap
        run: |
          docker buildx use default
          docker buildx inspect default
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote synchronized Production image set
        shell: bash
        run: |
          set -euo pipefail
          for image in "$PLATFORM_API_IMAGE" "$PLATFORM_ITSM_IMAGE" "$PLATFORM_RMM_IMAGE" "$PLATFORM_ADMIN_IMAGE"; do
            docker buildx imagetools create -t "$image:prod" -t "$image:latest" "$image:sha-${GITHUB_SHA}"
          done
          echo "Hi5Central Production release ${GITHUB_SHA} promoted as one platform set."
