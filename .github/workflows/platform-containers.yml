name: Platform Containers

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - name: ITSM
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
          - name: RMM
            context: apps/rmm
            image: ghcr.io/dansut24/hi5central-platform-rmm
          - name: Admin
            context: apps/admin
            image: ghcr.io/dansut24/hi5central-platform-admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  dev:
    name: Dev release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Dev
      url: https://dev.hi5central.com
    steps:
      - run: echo "Hi5Central Dev images published for ${GITHUB_SHA}"

  production:
    name: Production release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: containers
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://hi5central.com
    steps:
      - run: echo "Hi5Central Production images published for ${GITHUB_SHA}"
