name: Recovered Historical Rollout Migrations
on:
  pull_request:
    paths:
      - 'services/api/migrations/**'
      - 'services/api/test/recovered-rollout-migrations.mjs'
      - 'services/api/test/migration-empty-ledger-guard.mjs'
      - 'services/api/src/migrate.js'
      - 'services/api/src/migrationLedgerSafety.js'
      - 'services/api/src/migrationBaselineEvidence.js'
      - 'services/api/src/reportMigrationBaseline.mjs'
      - 'services/api/test/migration-baseline-evidence.mjs'
      - 'services/api/src/reviewedBaselineMigration.js'
      - 'services/api/src/reviewedBaselineMigrationRunner.mjs'
      - 'services/api/test/reviewed-baseline-migration.mjs'
      - 'deployment/release/REVIEWED_BASELINE_ROLLBACK_MIGRATIONS.md'
      - 'deployment/qa26/recovered-rollout-migration-provenance.json'
      - '.github/workflows/recovered-rollout-migrations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-migration-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact historical SQL checksums, identities and no duplicate filenames
        run: node --test services/api/test/recovered-rollout-migrations.mjs services/api/test/migration-empty-ledger-guard.mjs services/api/test/migration-baseline-evidence.mjs services/api/test/reviewed-baseline-migration.mjs
      - name: Check runtime migration runner grammar
        run: |
          node --check services/api/src/migrate.js
          node --check services/api/src/migrationBaselineEvidence.js
          node --check services/api/src/reportMigrationBaseline.mjs
          node --check services/api/src/reviewedBaselineMigration.js
          node --check services/api/src/reviewedBaselineMigrationRunner.mjs
