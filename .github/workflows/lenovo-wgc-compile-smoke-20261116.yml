name: Lenovo 1.0.524 Windows SDK WGC compile smoke

on:
  pull_request:
    branches:
      - feature/endpoint-setting-exceptions-20261114
    paths:
      - .github/workflows/lenovo-wgc-compile-smoke-20261116.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wgc-windows-sdk-compile:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a121cf0f03f89c866599ad2aba07eea9e2536c7
      - name: Restore exactly pinned 1.0.524 source package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://downloads.hi5central.com/rmm-codec-review/hi5central-streaming-stage2k-lenovo-source-20261116.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $env:RUNNER_TEMP\wgc-source.zip
          if((Get-FileHash $env:RUNNER_TEMP\wgc-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f1abc1b184c103a64198a0a5e29b37a58dfe4d1dd144a6155b675539bd2830bb'){throw 'Wrong source archive'}
          Expand-Archive -LiteralPath $env:RUNNER_TEMP\wgc-source.zip -DestinationPath $env:RUNNER_TEMP\wgc-src -Force
          $files=Get-ChildItem -LiteralPath $env:RUNNER_TEMP\wgc-src\changed-files -File -Recurse
          if($files.Count -ne 36){throw "Unexpected file count $($files.Count)"}
          foreach($f in $files){
            $rel=$f.FullName.Substring(("$env:RUNNER_TEMP\wgc-src\changed-files\").Length)
            $dest=Join-Path (Get-Location) $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -LiteralPath $f.FullName -Destination $dest -Force
          }
          Write-Host "Exactly 36 source files applied"
      - name: Syntax compile C++ WinRT WGC probe with the Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC missing'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $src='native\agent\Agent\chatpass_agent\src'
          $probe=Join-Path $env:RUNNER_TEMP 'wgc-syntax.cpp'
          [IO.File]::WriteAllText($probe,"#include `"wgc_user_probe.h`"`nint main(){return 0;}`n")
          $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /MT /Zs /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I"'+(Resolve-Path $src).Path+'" "'+$probe+'"'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'C++/WinRT WGC probe compile failed'}
          Write-Host "WGC header compiles against native Windows SDK"
