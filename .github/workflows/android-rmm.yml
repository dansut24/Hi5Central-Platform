name: Android RMM APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/rmm/**'
      - '.github/workflows/android-rmm.yml'
  pull_request:
    paths:
      - 'android/rmm/**'
      - '.github/workflows/android-rmm.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android/rmm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-RMM-Android-Debug-APK
          path: android/rmm/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
