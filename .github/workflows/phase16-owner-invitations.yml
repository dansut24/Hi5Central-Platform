name: Phase 16 Owner Invitation Safety
# No environment deployment; all databases are created on the disposable CI runner.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/phase16-owner-invitations.yml'
      - 'services/api/scripts/tenant-environment-owner-invite.mjs'
      - 'services/api/scripts/test-tenant-environment-prepare-integration.mjs'
      - 'services/api/scripts/test-sandbox-lifecycle-http.mjs'
      - 'services/api/migrations/platform-admin/139_managed_owner_invitation_audit.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase16-owner-invitations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify isolated first-owner issue, cancellation and MFA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check operator and test syntax
        run: |
          node --check services/api/scripts/tenant-environment-owner-invite.mjs
          node --check services/api/scripts/tenant-environment-activate.mjs
          node --check services/api/scripts/test-tenant-environment-prepare-integration.mjs
          node --check services/api/scripts/test-sandbox-lifecycle-http.mjs
      - name: Start strictly disposable PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name hi5-ephemeral-provisioning-pg \
            --publish 127.0.0.1:55437:5432 \
            --env POSTGRES_PASSWORD=hi5-ephemeral-ci-only \
            public.ecr.aws/docker/library/postgres:17-alpine
          docker run --detach --name hi5-ephemeral-uat-redis \
            --publish 127.0.0.1:55438:6379 \
            public.ecr.aws/docker/library/redis:8-alpine
          docker run --detach --name hi5-ephemeral-test-redis \
            --publish 127.0.0.1:55439:6379 \
            public.ecr.aws/docker/library/redis:8-alpine
          for attempt in {1..40}; do
            if docker exec hi5-ephemeral-provisioning-pg pg_isready --username postgres >/dev/null 2>&1 \
              && docker exec hi5-ephemeral-uat-redis redis-cli ping | grep -qx PONG \
              && docker exec hi5-ephemeral-test-redis redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          echo 'Ephemeral database or Redis failed readiness'
          exit 1
      - name: Install isolated test dependencies
        run: (cd services/api && npm ci --omit=dev)
      - name: Verify owner invitation cancellation, token denial and reissue
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true \
          HI5_PROVISIONING_TEST_SCOPE=isolated-github-actions \
          HI5_EPHEMERAL_PG_URL=postgresql://postgres:hi5-ephemeral-ci-only@127.0.0.1:55437/postgres \
          node --test services/api/scripts/test-tenant-environment-prepare-integration.mjs
      - name: Remove ephemeral services
        if: always()
        shell: bash
        run: |
          docker rm --force hi5-ephemeral-provisioning-pg hi5-ephemeral-uat-redis hi5-ephemeral-test-redis >/dev/null 2>&1 || true
          if docker ps -a --format '{{.Names}}' | grep -E '^hi5-ephemeral-(provisioning-pg|uat-redis|test-redis)$'; then
            echo 'Ephemeral service cleanup failed'
            exit 1
          fi
          echo 'Ephemeral Phase 16 services removed'
