name: EPM Browser Bridge Windows CI
on:
  push:
    branches:
      - feature/epm-file-elevation-pilot-20261114
    paths:
      - native/epm/Hi5Central.EpmBrowserHost/**
      - native/epm/browser-extension/**
      - native/epm/Install-EpmBrowserHost.ps1
      - .github/workflows/epm-browser-bridge-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-epm-browser-bridge:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate extension JavaScript
        shell: pwsh
        run: |
          node --check native/epm/browser-extension/background.js
          node --check native/epm/browser-extension/build-icon.js
          node native/epm/browser-extension/build-icon.js
          if (!(Test-Path native/epm/browser-extension/icon-128.png)) { throw "Icon was not created" }
          $m=Get-Content native/epm/browser-extension/manifest.json -Raw | ConvertFrom-Json
          if ($m.manifest_version -ne 3 -or $m.permissions -notcontains 'nativeMessaging') { throw "Unexpected extension manifest" }
      - name: Publish isolated unprivileged browser host
        shell: pwsh
        run: |
          dotnet publish native/epm/Hi5Central.EpmBrowserHost/Hi5Central.EpmBrowserHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o artifact/host
      - name: Browser protocol and input validation self-test
        shell: pwsh
        run: |
          & ./artifact/host/Hi5CentralEpmBrowserHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native Messaging host self-test failed" }
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path native/epm/Install-EpmBrowserHost.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Stage browser bridge artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/extension -Force | Out-Null
          Copy-Item native/epm/browser-extension/manifest.json artifact/extension/
          Copy-Item native/epm/browser-extension/background.js artifact/extension/
          Copy-Item native/epm/browser-extension/icon-128.png artifact/extension/
          Copy-Item native/epm/Install-EpmBrowserHost.ps1 artifact/
          $hash=(Get-FileHash artifact/host/Hi5CentralEpmBrowserHost.exe -Algorithm SHA256).Hash
          "HOST_EXE_SHA256=$hash" | Set-Content artifact/SHA256.txt -Encoding Ascii
          Write-Host "BROWSER_HOST_SHA256=$hash"
      - name: Test real Windows native host STDIO
        shell: pwsh
        run: |
          python native/epm/Hi5Central.EpmBrowserHost/test_native.py (Resolve-Path artifact/host/Hi5CentralEpmBrowserHost.exe)
          if ($LASTEXITCODE -ne 0) { throw "Native host STDIO test failed" }
      - name: Smoke test browser host installation in Windows PowerShell 5.1
        shell: pwsh
        run: |
          $epmRoot=Join-Path $env:ProgramFiles 'Hi5Central\EPM'
          New-Item -ItemType Directory -Path $epmRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $epmRoot 'Hi5CentralEpmPilot.exe') -Value 'CI placeholder, never executed' -Encoding ascii
          $hostExe=(Resolve-Path 'artifact/host/Hi5CentralEpmBrowserHost.exe').Path
          $ext=(Resolve-Path 'artifact/extension').Path
          $hash=(Get-FileHash $hostExe -Algorithm SHA256).Hash
          $script=(Resolve-Path 'artifact/Install-EpmBrowserHost.ps1').Path
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -HostExecutable $hostExe -ExtensionDirectory $ext -ExpectedHostSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 browser bridge install failed" }
          $hostName='com.hi5central.epm_browser'
          $manifest=(Join-Path $epmRoot 'BrowserBridge\native-messaging-host.json')
          $actual=Get-Content $manifest -Raw | ConvertFrom-Json
          if ($actual.name -ne $hostName -or $actual.type -ne 'stdio' -or
              $actual.allowed_origins.Count -ne 1 -or
              $actual.allowed_origins[0] -ne 'chrome-extension://mdablcgpimddfidkjilfglpcaolpopda/') {
            throw "Unexpected native host registration permissions"
          }
          foreach($vendor in @('Microsoft\Edge','Google\Chrome')) {
            $key="HKLM:\SOFTWARE\$vendor\NativeMessagingHosts\$hostName"
            if ((Get-Item $key).GetValue('') -ne $manifest) { throw "Missing exact native host registry registration" }
            Remove-Item $key -Recurse -Force
          }
          Remove-Item $epmRoot -Recurse -Force
          Write-Host 'PASS: PowerShell 5.1 browser bridge install and exact-origin registry smoke test.'
      - name: Upload Windows browser bridge
        uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-EPM-Browser-Bridge-CI
          path: artifact/
          retention-days: 14
