name: Cancel superseded Newtest StreamCore 542 candidate runs
on:
  push:
    branches:
      - canary/streamcore-logon-recovery-20261122
    paths:
      - .github/workflows/cancel-obsolete-streamcore-542-canary-runs.yml
permissions:
  actions: write
  contents: read
jobs:
  cancel-only-older-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the two superseded Newtest-only CI attempts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 45017983884 45018215342; do
            echo "Cancelling superseded Newtest-only candidate run ${run_id}"
            curl --retry 2 --silent --show-error --fail-with-body -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/dansut24/Hi5Central-Platform/actions/runs/${run_id}/cancel"
          done
          echo 'Only the latest 542 recovery candidate remains'
