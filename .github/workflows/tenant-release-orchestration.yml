name: Tenant Release Rollout Orchestration
on:
  pull_request:
    paths:
      - 'services/api/src/releaseRolloutPlanner.js'
      - 'services/api/src/genericReleaseAuthorization.js'
      - 'services/api/src/genericReleaseAdminApproval.js'
      - 'services/api/src/platformAdmin.js'
      - 'services/api/test/generic-release-admin-approval.mjs'
      - 'services/api/test/generic-release-postgres.mjs'
      - 'services/api/test/generic-release-failure-recovery.mjs'
      - 'apps/admin/src/features/admin/GenericReleasePlanning.jsx'
      - 'apps/admin/src/features/admin/PlatformAdminApp.jsx'
      - 'services/api/src/genericReleaseDiscovery.js'
      - 'services/api/src/genericReleasePreview.mjs'
      - 'services/api/src/certifiedReleaseFanout.js'
      - 'services/api/src/releaseFanoutDaemon.mjs'
      - 'services/api/src/tenantReleaseExecutor.mjs'
      - 'services/api/test/generic-release-discovery.mjs'
      - 'services/api/migrations/platform-admin/166_generic_release_stage_approvals.sql'
      - 'deployment/qa26/tenant-release-host-executor.mjs'
      - 'deployment/qa26/Dockerfile.certified-release-fanout'
      - 'deployment/qa26/Dockerfile.generic-tenant-release-executor'
      - 'services/api/src/tenantReleaseQueue.js'
      - 'services/api/src/runtimePoolPolicy.js'
      - 'services/api/src/runtimePoolManagedScheduler.js'
      - 'services/api/src/runtimePoolControl.js'
      - 'services/api/src/tenantRouteCutover.js'
      - 'services/api/src/tenantRouteActivationGate.js'
      - 'services/api/test/tenant-route-activation-gate.mjs'
      - 'services/api/src/renderQaTenantCaddyRoutes.js'
      - 'services/api/src/qaGatewayHostHandoff.js'
      - 'services/api/test/qa-caddy-outer-handoff-smoke.mjs'
      - 'services/api/test/qa-caddy-native-forwarded-host-smoke.mjs'
      - 'services/api/test/generate-qa-caddy-fixture.mjs'
      - 'services/api/test/qa-caddy-tenant-http-smoke.mjs'
      - 'services/api/src/tenantRoutePreviewOperator.js'
      - 'services/api/test/tenant-route-cutover.mjs'
      - 'services/api/src/releaseOperator.js'
      - 'services/api/src/releasePublicationCredential.js'
      - 'services/api/test/release-publication-credential.mjs'
      - 'deployment/qa26/bootstrap-release-publisher-dev-only.sql'
      - 'deployment/qa26/provision-release-publisher-admin.py'
      - 'services/api/src/releasePublicationRelay.mjs'
      - 'services/api/src/releasePublicationRelayDaemon.mjs'
      - 'services/api/test/release-publication-relay.mjs'
      - 'deployment/qa26/Dockerfile.release-publication-relay'
      - 'deployment/qa26/compose.release-publication-relay.yml'
      - 'services/api/src/tenantRuntimeReleaseLifecycle.js'
      - 'services/api/migrations/platform-admin/158_tenant_release_rollout_jobs.sql'
      - 'services/api/migrations/platform-admin/159_platform_release_test_qa_gates.sql'
      - 'services/api/migrations/platform-admin/160_tenant_test_runtime_assignments.sql'
      - 'services/api/migrations/platform-admin/161_release_rollout_blackouts.sql'
      - 'services/api/test/runtime-pool-policy.mjs'
      - 'services/api/test/runtime-route-manifest.mjs'
      - 'services/api/test/tenant-runtime-release-lifecycle.mjs'
      - 'services/api/test/release-rollout-planner.mjs'
      - 'services/api/test/tenant-release-queue.mjs'
      - 'services/api/test/qa-single-test-canary-gate.mjs'
      - 'services/api/test/qa-six-test-rollout-verifier.mjs'
      - 'deployment/qa26/single-test-canary/**'
      - 'deployment/qa26/Dockerfile.single-test-canary'
      - 'deployment/qa26/verify-six-qa-test-rollouts.mjs'
      - 'deployment/qa26/execute-six-qa-test-job-admin.mjs'
      - 'deployment/qa26/verify-six-qa-test-caddy-history.mjs'
      - 'deployment/qa26/arm-six-qa-test-permit-admin.sh'
      - 'deployment/qa26/stage-reviewed-six-qa-worker-admin.sh'
      - 'deployment/qa26/check-six-qa-test-credential-readiness.mjs'
      - 'deployment/qa26/run-six-qa-test-window-admin.sh'
      - 'deployment/qa26/install-reviewed-six-qa-test-timers-admin.sh'
      - 'deployment/qa26/repin-reviewed-qa-overnight-timer-admin.sh'
      - '.github/workflows/tenant-release-orchestration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-planning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and automated multi-tenant release planning
        run: |
          node --check src/releaseRolloutPlanner.js
          node --check src/genericReleaseAuthorization.js
          node --check src/genericReleaseAdminApproval.js
          node --check src/platformAdmin.js
          node --test test/generic-release-admin-approval.mjs
          node --check src/genericReleaseDiscovery.js
          node --check src/genericReleasePreview.mjs
          node --check src/certifiedReleaseFanout.js
          node --check src/releaseFanoutDaemon.mjs
          node --check src/tenantReleaseExecutor.mjs
          node --check ../../deployment/qa26/tenant-release-host-executor.mjs
          node --test test/generic-release-discovery.mjs test/certified-release-fanout.mjs
          node --check src/tenantReleaseQueue.js
          node --check src/tenantRouteCutover.js
          node --check src/tenantRouteActivationGate.js
          node --test test/tenant-route-activation-gate.mjs
          node --check src/renderQaTenantCaddyRoutes.js
          node --check src/qaGatewayHostHandoff.js
          node --check src/tenantRoutePreviewOperator.js
          node --test test/tenant-route-cutover.mjs
          node --test test/release-rollout-planner.mjs
          node --check ../../deployment/qa26/single-test-canary/services/api/src/qaSixTestCohort.js
          node --check ../../deployment/qa26/single-test-canary/services/api/src/tenantReleaseQueue.js
          node --check ../../deployment/qa26/single-test-canary/services/api/src/tenantReleaseExecutor.mjs
          node --check ../../deployment/qa26/single-test-canary/deployment/qa26/tenant-release-host-executor.mjs
          node --check ../../deployment/qa26/single-test-canary/launcher.mjs
          node --check ../../deployment/qa26/execute-six-qa-test-job-admin.mjs
          node --check ../../deployment/qa26/verify-six-qa-test-caddy-history.mjs
          bash -n ../../deployment/qa26/arm-six-qa-test-permit-admin.sh
          bash -n ../../deployment/qa26/stage-reviewed-six-qa-worker-admin.sh
          node --check ../../deployment/qa26/check-six-qa-test-credential-readiness.mjs
          bash -n ../../deployment/qa26/run-six-qa-test-window-admin.sh
          bash -n ../../deployment/qa26/install-reviewed-six-qa-test-timers-admin.sh
          bash -n ../../deployment/qa26/repin-reviewed-qa-overnight-timer-admin.sh
          node --test test/qa-single-test-canary-gate.mjs test/qa-six-test-rollout-verifier.mjs
          node --check src/runtimePoolPolicy.js
          node --check src/runtimePoolControl.js
          node --check src/runtimePoolManagedScheduler.js
          node --check src/tenantRuntimeReleaseLifecycle.js
          node --check src/releasePublicationCredential.js
          node --test test/release-publication-credential.mjs
          node --check src/releasePublicationRelay.mjs
          node --check src/releasePublicationRelayDaemon.mjs
          node --test test/runtime-pool-policy.mjs test/tenant-runtime-release-lifecycle.mjs test/runtime-route-manifest.mjs
      - name: Certify isolated generic scheduler and worker images
        run: |
          docker build --pull=false -f ../../deployment/qa26/Dockerfile.certified-release-fanout -t h5c-ci-generic-planner:reviewed ../..
          docker build --pull=false -f ../../deployment/qa26/Dockerfile.generic-tenant-release-executor -t h5c-ci-generic-executor:reviewed ../..
          test "$(docker image inspect h5c-ci-generic-planner:reviewed --format '{{.Config.User}}')" = "scheduler"
          docker run --rm --network none --entrypoint node h5c-ci-generic-planner:reviewed --input-type=module -e "import('./certifiedReleaseFanout.js').then(m=>{if(typeof m.fanoutCertifiedRelease!=='function')process.exit(1)})"
          echo "GENERIC_RELEASE_IMAGE_IMPORTS_AND_NONROOT_PLANNER_PASS"
      - name: Validate generated tenant routes using QA Caddy version
        run: |
          node test/generate-qa-caddy-fixture.mjs > /tmp/h5c-qa-route-preview.Caddyfile
          docker run --rm --network none \
            -v /tmp/h5c-qa-route-preview.Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:2.11.4-alpine caddy adapt \
              --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/h5c-qa-route-preview.json
          test -s /tmp/h5c-qa-route-preview.json
          node test/generate-qa-caddy-fixture.mjs --trusted > /tmp/h5c-qa-route-preview.Caddyfile
          docker run --rm --network none \
            -v /tmp/h5c-qa-route-preview.Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:2.11.4-alpine caddy adapt \
              --config /etc/caddy/Caddyfile --adapter caddyfile > /tmp/h5c-qa-route-preview.json
          test -s /tmp/h5c-qa-route-preview.json
          rm -f /tmp/h5c-qa-route-preview.Caddyfile /tmp/h5c-qa-route-preview.json
      - name: Live HTTP multi-tenant gateway switch and rollback (CI Docker only)
        run: |
          node test/qa-caddy-tenant-http-smoke.mjs
          node test/qa-caddy-outer-handoff-smoke.mjs
          node test/qa-caddy-native-forwarded-host-smoke.mjs

  rollout-queue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hi5_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: hi5_rollout_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hi5_ci -d hi5_rollout_ci"
          --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      DATABASE_URL: postgresql://hi5_ci:ci_only_password@localhost:5432/hi5_rollout_ci
      DEPLOYMENT_MODE: managed
      RUNTIME_ENVIRONMENT: live
      NODE_ENV: test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Isolated Postgres migration and transaction tests
        run: |
          npm run migrate
          # Generic worker may only enter even preflight with explicit reviewed
          # mode. No host route, job claim, lease, pause or gateway write.
          if RELEASE_WORKER_SCOPE=generic RELEASE_GATEWAY=test node src/tenantReleaseExecutor.mjs --preflight > /dev/null 2>&1; then
            echo 'Generic worker incorrectly accepted missing execution acknowledgement'
            exit 1
          fi
          RELEASE_WORKER_SCOPE=generic RELEASE_GENERIC_WORKER_ACK=reviewed-stage-approval-only RELEASE_GATEWAY=test node src/tenantReleaseExecutor.mjs --preflight
          node --test test/tenant-release-queue.mjs
          node --test test/generic-release-postgres.mjs
          node --test test/generic-release-failure-recovery.mjs
          node --test test/release-publication-relay.mjs
