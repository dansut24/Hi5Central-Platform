name: Testing tenant release centre responsive hotfix
on:
  push:
    branches: [hotfix/release-tracked-config-responsive-20261011]
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: apps/itsm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/itsm/package-lock.json
      - run: npm ci
      - run: node test/release-tracking-layout.mjs
      - run: npm run build
  package-web:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/itsm
          push: true
          tags: ghcr.io/dansut24/hi5central-platform-itsm:release-layout-hotfix-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=isolated-testing-tenant-release-centre-ui
