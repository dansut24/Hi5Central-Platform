name: Lenovo 1.0.530 VP8 direct GDI 1080p policy and Win32 smoke
on:
  pull_request:
    branches:
      - test/lenovo-streaming-stage2o-20261116
    paths:
      - .github/workflows/lenovo-vp8-gdi-direct1080-smoke-20261116.yml
      - native/agent/Agent/chatpass_agent/src/gdi_direct_1080_policy.h
      - native/agent/Agent/chatpass_agent/tests/gdi_direct_1080_policy_test.cpp
      - native/agent/Agent/chatpass_agent/tests/gdi_direct_1080_win32_benchmark.cpp
      - native/agent/Agent/chatpass_agent/experiments/apply_gdi_direct_1080_530.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gdi-direct-software:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate source patch syntax, safety constraints, and original GDI fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent'
          $patch=Join-Path $root 'experiments/apply_gdi_direct_1080_530.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $patch).Path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw '530 source patch PowerShell parser failure'}
          $text=Get-Content -LiteralPath $patch -Raw
          $policy=Get-Content -LiteralPath (Join-Path $root 'src/gdi_direct_1080_policy.h') -Raw
          foreach($required in @('HI5_GDI_DIRECT_1080_CANARY','GdiDirectNormalUserDesktop','GdiDirectDrawScaledCursor','COLORONCOLOR','captureCurrentDisplayGdiLocked();','source.currentDisplayInfo()','actual_capture_fps=','avg_capture_ms=','currentIndex == 0','directEligible','if(!captured && directEligible)')){
            if(-not $text.Contains($required)){throw ('Required guarded GDI feature absent '+$required)}
          }
          foreach($unsafe in @('CreateFreeThreaded(','CreateForMonitor(','D3D11CreateDevice(','SetThreadDesktop(','SendInput(')){
            if($text.Contains($unsafe)){throw ('Software GDI canary contains unwanted GPU or input implementation '+$unsafe)}
          }
          foreach($required in @('nativeWidth<=1920 && nativeHeight<=1080','selectedMonitor==0','!secureHelper','width=0','height=0')){
            if(-not $policy.Contains($required)){throw ('GDI aspect/protection policy absent '+$required)}
          }
          Write-Host 'Guarded GDI primary direct capture, UAC fallback, cursor scale and 5s telemetry: PASS'
      - name: Compile software-only I420 geometry and real Windows GDI StretchBlt smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC unavailable'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $root='native/agent/Agent/chatpass_agent/tests'
          foreach($name in @('gdi_direct_1080_policy_test','gdi_direct_1080_win32_benchmark')){
            $source=(Resolve-Path (Join-Path $root ($name+'.cpp'))).Path
            $exe=Join-Path $env:RUNNER_TEMP ($name+'.exe')
            $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /MT /O2 /DNOMINMAX /DWIN32_LEAN_AND_MEAN "'+$source+'" /Fe:"'+$exe+'" && "'+$exe+'"'
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){throw ('GDI Win32 smoke regression failed '+$name)}
          }
          Write-Host 'Software GDI 1080 output and synthetic Windows COLORONCOLOR scan PASS; no install or changes to Lenovo'
