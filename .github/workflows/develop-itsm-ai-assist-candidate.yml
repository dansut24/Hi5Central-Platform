name: Develop - AI Assist UAT candidate
on:
  push:
    branches: [feature/itsm-ai-assist-customer-uat-20261011]
permissions:
  contents: read
  packages: write
jobs:
  verify-api:
    environment: develop
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_only
      REDIS_URL: redis://localhost:6379
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/itsmAiAssist.js && node --check src/index.js
      - run: node test/itsm-ai-assist.mjs
      - run: npm run build:runtime
  verify-itsm:
    environment: develop
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: apps/itsm}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/itsm/package-lock.json
      - run: npm ci
      - run: npm run build
  candidate-images:
    environment: develop
    needs: [verify-api,verify-itsm]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - component: itsm
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:develop-itsm-ai-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.release.source=develop
            com.hi5central.release.purpose=uat-test-candidate
