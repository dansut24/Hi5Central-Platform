name: Stage UAT canary MFA compatibility (no cutover)
on:
  push:
    branches: [hotfix/uat-canary-mfa-20261011]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --check src/sandboxCredentialLogin.js && node --check src/sandboxMfaPolicy.js
      - run: node test/sandbox-mfa-policy.mjs && node test/runtime-pool-tenant-guard.mjs
  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: services/api
            image: ghcr.io/dansut24/hi5central-platform-api
          - name: ITSM
            context: apps/itsm
            image: ghcr.io/dansut24/hi5central-platform-itsm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - run: node .github/scripts/generate-release-manifest.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:uat-mfa-staged-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.hi5central.purpose=uat-mfa-compatibility-staged-not-cutover
