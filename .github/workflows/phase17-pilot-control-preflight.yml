name: Phase 17 Pilot Control Plane Preflight
# Static checks ONLY. This workflow must never deploy or expose a customer.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/phase17-pilot-control-preflight.yml'
      - 'infrastructure/managed-pilot-control/**'
      - 'services/api/src/platformAdmin.js'
      - 'services/api/src/platformAdminMfa.js'
      - 'services/api/tests/platformAdminMfa.test.mjs'
      - 'services/api/migrations/platform-admin/141_platform_admin_mfa.sql'
      - 'apps/admin/src/features/admin/PlatformAdminApp.jsx'
      - 'services/api/src/pilotAdminBootstrap.js'
      - 'services/api/scripts/pilot-admin-bootstrap.mjs'
      - 'services/api/scripts/pilot-admin-bootstrap-sign.mjs'
      - 'services/api/tests/pilotAdminBootstrap.test.mjs'
      - 'services/api/migrations/platform-admin/142_pilot_admin_bootstrap.sql'
      - 'services/api/src/mailer.js'
      - 'services/api/src/index.js'
      - 'services/api/src/customerUpdatePolicy.js'
      - 'services/api/src/customerConfigurationPromotion.js'
      - 'services/api/tests/customerConfigurationPromotion.test.mjs'
      - 'services/api/src/tenantRelease.js'
      - 'services/api/src/releaseOperator.js'
      - 'services/api/tests/customerUpdatePolicy.test.mjs'
      - 'services/api/migrations/platform-admin/143_customer_update_onboarding.sql'
      - 'services/api/migrations/platform-admin/144_tenant_owner_onboarding_intent.sql'
      - 'apps/itsm/src/features/onboarding/OnboardingWizard.jsx'
      - 'apps/itsm/src/features/marketing/SignupPage.jsx'
      - 'apps/itsm/Dockerfile'
      - 'apps/itsm/deployment/runtime-config-entrypoint.sh'
      - 'services/api/src/managedSignupValidation.js'
      - 'apps/itsm/src/features/marketing/MarketingApp.css'
      - 'services/api/src/managedPublicSignup.js'
      - 'services/api/tests/managedPublicSignup.test.mjs'
      - 'services/api/migrations/platform-admin/145_managed_public_signup_requests.sql'

      - 'apps/itsm/src/features/settings/ProductionReleaseManagement.jsx'
      - 'apps/admin/src/features/admin/PlatformAdminApp.css'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate private pilot model syntax and adversarial constraints
        run: |
          node --check infrastructure/managed-pilot-control/preflight.mjs
          node --check infrastructure/managed-pilot-control/validate.mjs
          node --test infrastructure/managed-pilot-control/validate.test.mjs
      - name: Verify Admin MFA, recovery and SSO fail-closed tests
        run: node --test services/api/tests/platformAdminMfa.test.mjs
      - name: Verify first Admin invite authorization and no-session acceptance
        run: |
          node --check services/api/scripts/pilot-admin-bootstrap.mjs
          node --check services/api/scripts/pilot-admin-bootstrap-sign.mjs
          node --test services/api/tests/pilotAdminBootstrap.test.mjs
      - name: Validate Managed vs Custom customer update policy and optional UAT
        run: |
          node --check services/api/src/customerUpdatePolicy.js
          node --test services/api/tests/customerUpdatePolicy.test.mjs
          node --test services/api/tests/managedPublicSignup.test.mjs
          node --check services/api/src/managedPublicSignup.js
          node --test services/api/tests/customerConfigurationPromotion.test.mjs
      - name: Compile the ITSM customer onboarding wizard
        run: |
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "ghcr.io/dansut24/hi5central-platform-signup-preview:sha-${GITHUB_SHA}" apps/itsm
      - name: Syntax-check disposable Production shadow rehearsal (never executed in CI)
        run: |
          sh -n infrastructure/managed-pilot-control/phase22-shadow/phase22-env.sh
          sh -n infrastructure/managed-pilot-control/phase22-shadow/phase22-shadow-rehearsal.sh
          sh -n infrastructure/managed-pilot-control/phase22-shadow/phase22-api-rehearsal.sh
          node --check infrastructure/managed-pilot-control/phase22-shadow/phase22-shadow-readonly.mjs
      - name: Render disposable pilot control topology (no Docker containers started)
        working-directory: infrastructure/managed-pilot-control
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const replacements={
            POSTGRES_USER:'pilot_user_a',POSTGRES_DB:'pilot_control_db',
            POSTGRES_PASSWORD:'a'.repeat(40),
            REDIS_PASSWORD:'b'.repeat(40),
            MFA_ENCRYPTION_KEY:'c'.repeat(64),
            CONNECT_CODE_HMAC_KEY:'d'.repeat(64),
            DATABASE_URL:'postgresql://pilot_user_a:'+ 'a'.repeat(40) +'@postgres:5432/pilot_control_db',
            REDIS_URL:'redis://:'+ 'b'.repeat(40) +'@redis:6379/0',
          }
          for(const key of ['POSTGRES_IMAGE','REDIS_IMAGE','API_IMAGE','ADMIN_IMAGE']){
            const prefix=key==='POSTGRES_IMAGE'?'mirror.gcr.io/library/postgres':
              key==='REDIS_IMAGE'?'mirror.gcr.io/library/redis':
              key==='API_IMAGE'?'ghcr.io/dansut24/hi5central-platform-api':
              'ghcr.io/dansut24/hi5central-platform-admin'
            replacements[key]=prefix+'@sha256:'+'a'.repeat(64)
          }
          const content=readFileSync('runtime.env.example','utf8').split('\n')
            .map(line=>{
              const key=line.match(/^([A-Z][A-Z0-9_]*)=/)?.[1]
              return key&&Object.hasOwn(replacements,key)?key+'='+replacements[key]:line
            }).join('\n')
          writeFileSync('runtime.env',content,{mode:0o600})
          NODE
          trap 'rm -f runtime.env' EXIT
          node preflight.mjs --check
          if docker compose --env-file runtime.env -f compose.yml config --format json \
             | node -e '
                 let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
                   const m=JSON.parse(s);
                   if(Object.values(m.services||{}).some(v=>v.ports?.length))process.exit(1);
                   console.log("Rendered five isolated, no-host-port pilot control services");
                 })'; then
            echo "Pilot topology render passed; no resources deployed"
          else
            echo "Pilot Compose static render rejected"
            exit 1
          fi
      - name: Build immutable matching private-pilot API and Admin images
        run: |
          set -euo pipefail
          for service in api admin; do
            case "$service" in
              api) context=services/api ;;
              admin) context=apps/admin ;;
            esac
            docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "ghcr.io/dansut24/hi5central-platform-${service}:sha-${GITHUB_SHA}" "$context"
          done
      - name: Disposable real-API first Admin invite and MFA lifecycle
        working-directory: infrastructure/managed-pilot-control
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file runtime.env -f compose.yml -f ci.override.yml down --volumes --remove-orphans 2>/dev/null || true
            docker network rm hi5central-pilot-control-edge 2>/dev/null || true
            rm -f ci.override.yml runtime.env
            if docker ps -a --format '{{.Names}}' | grep -q '^hi5central-pilot-control-'; then
              echo 'Disposable pilot container cleanup failed'
              exit 1
            fi
          }
          trap cleanup EXIT
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const replacements={
            POSTGRES_USER:'pilot_user_a',
            POSTGRES_DB:'pilot_control_db',
            POSTGRES_PASSWORD:'a'.repeat(40),
            REDIS_PASSWORD:'b'.repeat(40),
            MFA_ENCRYPTION_KEY:'c'.repeat(64),
            CONNECT_CODE_HMAC_KEY:'d'.repeat(64),
            DATABASE_URL:'postgresql://pilot_user_a:'+ 'a'.repeat(40) +'@postgres:5432/pilot_control_db',
            REDIS_URL:'redis://:'+ 'b'.repeat(40) +'@redis:6379/0',
          }
          for (const key of ['POSTGRES_IMAGE','REDIS_IMAGE','API_IMAGE','ADMIN_IMAGE']){
            const name=key==='POSTGRES_IMAGE'?'mirror.gcr.io/library/postgres'
              :key==='REDIS_IMAGE'?'mirror.gcr.io/library/redis'
              :key==='API_IMAGE'?'ghcr.io/dansut24/hi5central-platform-api'
              :'ghcr.io/dansut24/hi5central-platform-admin'
            replacements[key]=name+'@sha256:'+'a'.repeat(64)
          }
          const lines=readFileSync('runtime.env.example','utf8').split('\n').map(line=>{
            const name=line.match(/^([A-Z][A-Z0-9_]*)=/)?.[1]
            return name&&Object.hasOwn(replacements,name)?name+'='+replacements[name]:line
          })
          writeFileSync('runtime.env',lines.join('\n'),{mode:0o600})
          NODE
          docker network create --internal --driver bridge hi5central-pilot-control-edge >/dev/null
          docker pull mirror.gcr.io/library/postgres:17-alpine
          docker pull mirror.gcr.io/library/redis:8-alpine
          cat > ci.override.yml <<EOF
          services:
            postgres:
              image: mirror.gcr.io/library/postgres:17-alpine
            redis:
              image: mirror.gcr.io/library/redis:8-alpine
            migrate:
              image: ghcr.io/dansut24/hi5central-platform-api:sha-${GITHUB_SHA}
            api:
              image: ghcr.io/dansut24/hi5central-platform-api:sha-${GITHUB_SHA}
            admin:
              image: ghcr.io/dansut24/hi5central-platform-admin:sha-${GITHUB_SHA}
          EOF
          if ! docker compose --env-file runtime.env -f compose.yml -f ci.override.yml up -d --wait --wait-timeout 180; then
            echo 'Disposable first-admin integration startup failed. Safe migration diagnostic lines:'
            docker logs hi5central-pilot-control-migrate-1 2>&1 \
              | grep -Ei 'Applying migration|error|failure|syntax|constraint|duplicate|invalid|refus' \
              | tail -35 | cut -c1-220 || true
            exit 1
          fi
          GITHUB_ACTIONS=true HI5_PILOT_DISPOSABLE_CI=1 node test-first-admin-lifecycle.mjs --run --confirm CI_ONLY_FAKE_APPROVALS
          echo 'The first-admin synthetic pilot project will now be removed including volumes.'
      - uses: docker/login-action@v3
        if: success()
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable private-pilot control image pair
        if: success()
        run: |
          set -euo pipefail
          for service in api admin; do
            docker push "ghcr.io/dansut24/hi5central-platform-${service}:sha-${GITHUB_SHA}"
          done
          docker push "ghcr.io/dansut24/hi5central-platform-signup-preview:sha-${GITHUB_SHA}"
          echo "Matched private-pilot API/Admin and unpublished-on-web signup-preview revision ${GITHUB_SHA}"
