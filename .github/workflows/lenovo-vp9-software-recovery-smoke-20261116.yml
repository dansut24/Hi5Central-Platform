name: Lenovo 1.0.529 software VP9 recovery - clock and no-GPU smoke
on:
  pull_request:
    branches:
      - test/lenovo-streaming-stage2o-20261116
    paths:
      - .github/workflows/lenovo-vp9-software-recovery-smoke-20261116.yml
      - native/agent/Agent/chatpass_agent/src/vp9_mf_encoder.cpp
      - native/agent/Agent/chatpass_agent/src/vp9_mf_encoder.h
      - native/agent/Agent/chatpass_agent/src/vp9_realtime_policy.h
      - native/agent/Agent/chatpass_agent/tests/vp9_realtime_policy_test.cpp
      - native/agent/Agent/chatpass_agent/experiments/vp9_software_profile_patch.inc
      - native/agent/Agent/chatpass_agent/experiments/vp9_software_telemetry_patch.inc
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vp9-sw-clock-and-failure-gate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject WGC live capture or hardware preference and verify recovery source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent'
          $src=Get-Content "$root/src/vp9_mf_encoder.cpp" -Raw
          $policy=Get-Content "$root/src/vp9_realtime_policy.h" -Raw
          $profile=Get-Content "$root/experiments/vp9_software_profile_patch.inc" -Raw
          $stats=Get-Content "$root/experiments/vp9_software_telemetry_patch.inc" -Raw
          foreach($marker in @('vpx_codec_vp9_cx()','vpx_codec_encode(','VPX_DL_REALTIME','VPX_FRAME_IS_KEY','Vp9Clock90k(','libvpx-VP9-software-realtime','MF_E_TRANSFORM_NEED_MORE_INPUT','return true;','outputAttempt < 8')){
            if(-not $src.Contains($marker)){throw ('VP9 recovery missing '+$marker)}
          }
          foreach($marker in @('profile.fps','reconfigure(','m_externalConfiguredFps')){
            if(-not $profile.Contains($marker)){throw ('VP9 dynamic profile missing '+$marker)}
          }
          if(-not $stats.Contains('actual_sent_fps_5s=')){throw 'VP9 actual FPS telemetry missing'}
          if(-not $policy.Contains('steady_clock::time_point')){throw 'Monotonic clock missing'}
          foreach($unsafe in @('HI5_WGC_LIVE_CANARY','D3D11CreateDevice(','CreateFreeThreaded(')){
            if($src.Contains($unsafe)){throw ('Software VP9 has GPU capture dependency '+$unsafe)}
          }
          Write-Host 'Software VP9 libvpx, monotonic timestamps, keyframe and no GPU/WGC changes: PASS'
      - name: Compile and execute Win64 VP9 idle2-to-motion60 timing regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC unavailable'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $test=(Resolve-Path 'native/agent/Agent/chatpass_agent/tests/vp9_realtime_policy_test.cpp').Path
          $exe=Join-Path $env:RUNNER_TEMP 'vp9_realtime_policy_test.exe'
          $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /MT /O2 /DNOMINMAX /DWIN32_LEAN_AND_MEAN "'+$test+'" /Fe:"'+$exe+'" && "'+$exe+'"'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'VP9 timing regression failed'}
          Write-Host 'VP9 software clock regression PASS; no agent installed'
