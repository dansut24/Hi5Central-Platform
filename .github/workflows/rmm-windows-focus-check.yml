name: RMM Windows editable focus probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/agent/Agent/chatpass_agent/src/remote_focus_probe.h'
      - 'native/agent/Agent/chatpass_agent/src/ipc/input_pipe.h'
      - 'native/agent/Agent/chatpass_agent/src/streamer_main.cpp'
      - '.github/workflows/rmm-windows-focus-check.yml'
  pull_request:
    paths:
      - 'native/agent/Agent/chatpass_agent/src/remote_focus_probe.h'
      - 'native/agent/Agent/chatpass_agent/src/ipc/input_pipe.h'
      - 'native/agent/Agent/chatpass_agent/src/streamer_main.cpp'
      - '.github/workflows/rmm-windows-focus-check.yml'

permissions:
  contents: read

jobs:
  compile-focus-probe:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile focus probe with Windows SDK and MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Windows C++ tools missing" }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $src = 'native\agent\Agent\chatpass_agent\src'
          $test = Join-Path $env:RUNNER_TEMP 'focus_smoke.cpp'
          @'
          #include "ipc/input_pipe.h"
          #include "remote_focus_probe.h"
          int main() { hi5::InputPipeWriter writer; return 0; }
          '@ | Set-Content -Path $test -Encoding utf8
          $cmd = 'call "' + $dev + '" -arch=x64 -host_arch=x64 && cl.exe /nologo /std:c++17 /EHsc /W3 /c /I "' + (Resolve-Path $src).Path + '" "' + $test + '" /Fo:"' + (Join-Path $env:RUNNER_TEMP 'focus_smoke.obj') + '"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Windows focus probe did not compile." }
