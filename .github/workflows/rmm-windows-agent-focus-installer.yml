name: RMM Windows agent focus test installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/agent/Agent/chatpass_agent/src/remote_focus_probe.h'
      - 'native/agent/Agent/chatpass_agent/src/ipc/input_pipe.h'
      - 'native/agent/Agent/chatpass_agent/src/streamer_main.cpp'
      - 'native/agent/Agent/chatpass_agent/src/service/service_main.cpp'
      - '.github/workflows/rmm-windows-agent-focus-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-focus-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-focus-agent:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          nuget install Microsoft.Web.WebView2 -OutputDirectory native/agent/Agent/chatpass_agent/external -NonInteractive
          $vcpkg = 'C:\vcpkg\vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw 'GitHub runner vcpkg was not found at C:\vcpkg.' }
          # Media transport must be built in. Without the srtp feature, vcpkg
          # configures libdatachannel with NO_MEDIA=ON and offers m=video 0.
          & $vcpkg install openssl:x64-windows-static nlohmann-json:x64-windows-static libvpx:x64-windows-static 'libdatachannel[srtp,ws]:x64-windows-static'
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency install failed with exit code $LASTEXITCODE." }
          $ports = & $vcpkg list
          if ($LASTEXITCODE -ne 0 -or -not ($ports -match 'libdatachannel\[srtp\]:x64-windows-static')) {
            throw "Windows WebRTC build blocked: libdatachannel[srtp] not installed (would disable video media)."
          }

      - name: Build current Windows Agent setup
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools not found.' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $repo = (Resolve-Path 'native/agent/Agent/chatpass_agent').Path
          $script = Join-Path $repo 'installer\windows\Build-AgentInstaller.ps1'
          $agentVersion = '1.0.' + (500 + [int]'${{ github.run_number }}')
          Write-Host "Windows Agent version: $agentVersion"
          $cmd = 'call "' + $devcmd + '" -arch=x64 -host_arch=x64 && powershell -NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -Clean -Generator "Visual Studio 18 2026" -Platform x64 -VcpkgRoot C:\vcpkg -VcpkgTriplet x64-windows-static -LibDataChannelRoot C:\vcpkg\installed\x64-windows-static -InnoSetupCompiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -AgentVersion "' + $agentVersion + '"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Windows Agent installer build failed with exit code $LASTEXITCODE." }
          $built = 'native/agent/Agent/chatpass_agent/dist/installer/Hi5CentralAgentSetup.exe'
          if (-not (Test-Path $built)) { throw 'Windows Agent installer output is missing.' }
          $patchHost = Get-ChildItem 'native/agent/Agent/chatpass_agent/build' -Filter 'Hi5CentralPatchHost.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $patchHost) { throw 'Windows PatchHost build output is missing.' }
          Write-Host "PatchHost: $($patchHost.FullName) ($($patchHost.Length) bytes)"
          $payloadDir = 'native/agent/Agent/tenant_installer/windows/payload'
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          Copy-Item $built "$payloadDir/Hi5CentralAgentSetup.exe"
          Write-Host "Current Agent setup size: $((Get-Item $built).Length) bytes"

      - name: Upload Windows focus test installer
        uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Windows-Agent-Focus-Test-Installer
          path: native/agent/Agent/chatpass_agent/dist/installer/Hi5CentralAgentSetup.exe
          if-no-files-found: error
          retention-days: 14
