name: Lenovo 1.0.524 Stage 2K - isolated Windows Graphics Capture frame-arrival probe

on:
  pull_request:
    branches:
      - feature/endpoint-setting-exceptions-20261114
    paths:
      - .github/workflows/lenovo-streaming-stage2k-20261116.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lenovo-streaming-stage2k-windows-canary:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a121cf0f03f89c866599ad2aba07eea9e2536c7
      - name: Verify exact source-matched 510 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '2a121cf0f03f89c866599ad2aba07eea9e2536c7'
          $base = (git rev-parse HEAD).Trim()
          if ($base -ne $expected) {
            $parent = (git rev-parse HEAD^1).Trim()
            if ($parent -ne $expected) { throw "Unexpected source base. Got $base parent $parent" }
          }
          Write-Host "510 source base verified as $expected"

      - name: Apply qualified 1.0.523 with isolated, on-demand WGC event-driven probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url='https://downloads.hi5central.com/rmm-codec-review/hi5central-streaming-stage2k-lenovo-source-20261116.zip'
          $sha='476b8f00a19f6d83cb40968d62a64620fbc02074e59aad6794dbaecbadb3b0f3'
          $zip=Join-Path $env:RUNNER_TEMP 'lenovo-streamer-source.zip'
          $out=Join-Path $env:RUNNER_TEMP 'lenovo-streamer-source'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $sha){throw "Source package SHA256 mismatch $actual"}
          Expand-Archive -Path $zip -DestinationPath $out
          $src=Join-Path $out 'changed-files'
          $files=@(Get-ChildItem -LiteralPath $src -Recurse -File)
          if($files.Count -ne 36){throw "Expected exactly 36 source files, found $($files.Count)"}
          foreach($file in $files){
            $relative=$file.FullName.Substring($src.Length + 1) -replace '\\','/'
            $dest=Join-Path (Get-Location).Path $relative
            if(-not (Test-Path $dest)){
              $newSource = @(
                'native/agent/Agent/chatpass_agent/src/rtc_keyframe_recovery_gate.h',
                'native/agent/Agent/chatpass_agent/src/secure_desktop_handoff_policy.h',
                'native/agent/Agent/chatpass_agent/src/i420_text_scale.h',
                'native/agent/Agent/chatpass_agent/src/frame_age_clock.h',
                'native/agent/Agent/chatpass_agent/src/gdi_surface_reuse_policy.h',
                'native/agent/Agent/chatpass_agent/src/capture_stage_split.h',
                'native/agent/Agent/chatpass_agent/src/gdi_bitblt_policy.h',
                'native/agent/Agent/chatpass_agent/src/bgra_luma_sse2.h',
                'native/agent/Agent/chatpass_agent/src/secure_helper_restart_policy.h',
                'native/agent/Agent/chatpass_agent/src/dxgi_context_policy.h',
                'native/agent/Agent/chatpass_agent/src/dxgi_user_probe_policy.h',
                'native/agent/Agent/chatpass_agent/src/dxgi_user_probe.h',
                'native/agent/Agent/chatpass_agent/CMakeLists.txt',
                'native/agent/Agent/chatpass_agent/src/wgc_user_probe.h',
                'native/agent/Agent/chatpass_agent/src/wgc_probe_policy.h',
                'native/agent/Agent/chatpass_agent/tests/rtc_keyframe_recovery_gate_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/secure_desktop_handoff_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/i420_text_scale_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/frame_age_clock_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/gdi_surface_reuse_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/capture_stage_split_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/gdi_bitblt_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/gdi_bitblt_win32_benchmark.cpp',
                'native/agent/Agent/chatpass_agent/tests/bgra_luma_sse2_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/secure_helper_restart_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/dxgi_context_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/dxgi_user_probe_policy_test.cpp',
                'native/agent/Agent/chatpass_agent/tests/wgc_probe_policy_test.cpp'
              )
              if($newSource -notcontains $relative){throw "Unrecognized source path $relative"}
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $dest -Force
          }
          Write-Host 'Applied qualified 523 plus on-demand WGC event-driven monitor probe'

      - name: Assert actual compiled DXGI implementation safely falls back
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content native/agent/Agent/chatpass_agent/CMakeLists.txt -Raw
          $source = Get-Content native/agent/Agent/chatpass_agent/src/platform/windows/windows_screen.cpp -Raw
          if ($cmake -notmatch 'src/platform/windows/windows_screen\.cpp') { throw 'Windows capture source not in CMake' }
          if ($source -notmatch 'enableGdiFallback\("DuplicateOutput failed"') { throw 'Compiled DXGI failure is not handled by GDI' }
          if ($source -notmatch 'if \(useGdiFallback \|\| !duplication\)') { throw 'GDI capture fallback path missing' }
          if ($source -match 'throw std::runtime_error\("DuplicateOutput failed"\)') { throw 'Old helper-crashing throw is present' }
          Write-Host 'Actual compiled DXGI source protects against fatal DuplicateOutput errors'

      - name: Verify RTC NACK PLI real H264 IDR source and capture canary safety
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $sender=Get-Content (Join-Path $r 'webrtc_sender.cpp') -Raw
          $h264=Get-Content (Join-Path $r 'h264_mf_encoder.cpp') -Raw
          $stream=Get-Content (Join-Path $r 'streamer_main.cpp') -Raw
          foreach($s in @('RtcpNackResponder','PliHandler','requestRecoveryKeyframe','HI5_RTCP_RECOVERY_ENABLE')){
            if(-not $sender.Contains($s)){throw "RTC recovery missing: $s"}
          }
          if(-not $h264.Contains('out.keyframe = ContainsH264Idr(out.data)')){throw 'H264 must mark only actual IDR'}
          if($h264.Contains('out.keyframe = ContainsH264Idr(out.data) || forceKeyframe')){throw 'False IDR proof detected'}
          if(-not $h264.Contains('CODECAPI_AVEncVideoForceKeyFrame')){throw 'H264 ICodecAPI canary missing'}
          if(-not $stream.Contains('HI5_LATENCY_CAPTURE_CANARY')){throw 'Capture canary missing'}
          Write-Host 'RTCP+IDR source safety assertions passed'

      - name: Compile standalone MSVC recovery-gate test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC missing'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $test='native/agent/Agent/chatpass_agent/tests/rtc_keyframe_recovery_gate_test.cpp'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /O2 /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN '+$test+' /Fe:dist\rtc_keyframe_recovery_gate_test.exe && dist\rtc_keyframe_recovery_gate_test.exe'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'Native keyframe gate test failed'}
          Write-Host 'MSVC RTC keyframe gate test PASSED'

      - name: Validate compiled service secure-mode ownership and text canary gating
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent/src'
          $cmake=Get-Content 'native/agent/Agent/chatpass_agent/CMakeLists.txt' -Raw
          $win=Get-Content (Join-Path $root 'platform/windows/windows_service.cpp') -Raw
          $video=Get-Content (Join-Path $root 'webrtc_sender.cpp') -Raw
          $scaling=Get-Content (Join-Path $root 'i420_text_scale.h') -Raw
          if($cmake -notmatch 'src/platform/windows/windows_service[.]cpp'){throw 'Windows service not compiled'}
          foreach($expected in @('ShouldHoldSecureDesktop', 'secureInputPipe.GetUACActive()', 'gotNormal && !useSecure', '!holdSecure && normalFresh')){
            if(-not $win.Contains($expected)){throw "Missing secure handoff fence: $expected"}
          }
          if($video -notmatch 'HI5_H264_FILTERED_SCALING_CANARY"[,] 0[,] 0[,] 1'){throw 'Text scaler must default OFF'}
          if(-not $scaling.Contains('ScalePlaneBilinear')){throw 'Filtered I420 scaler missing'}
          Write-Host 'Secure handoff ownership and disabled-by-default H264 quality canary verified'

      - name: Compile and run twelve portable policy regression tests on Windows MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC not found'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach($name in @('rtc_keyframe_recovery_gate_test','secure_desktop_handoff_policy_test','i420_text_scale_test','frame_age_clock_test','gdi_surface_reuse_policy_test','capture_stage_split_test','gdi_bitblt_policy_test','bgra_luma_sse2_test','secure_helper_restart_policy_test','dxgi_context_policy_test','dxgi_user_probe_policy_test','wgc_probe_policy_test')){
            $src='native/agent/Agent/chatpass_agent/tests/'+$name+'.cpp'
            $exe='dist\'+$name+'.exe'
            $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /O2 /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN '+$src+' /Fe:'+$exe+' && '+$exe
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){throw "MSVC test failed: $name"}
            Write-Host "PASSED: $name"
          }

      - name: Verify QPC capture and Intel async MFT instrumentation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $capture=Get-Content (Join-Path $r 'streamer_main.cpp') -Raw
          $service=Get-Content (Join-Path $r 'platform/windows/windows_service.cpp') -Raw
          $mft=Get-Content (Join-Path $r 'h264_mf_encoder.cpp') -Raw
          $sender=Get-Content (Join-Path $r 'webrtc_sender.cpp') -Raw
          $clock=Get-Content (Join-Path $r 'frame_age_clock.h') -Raw
          foreach($term in @('ReadSharedFrameQpcNanoseconds','capture_avg_ms=','shmem_avg_ms=')){
            if(-not $capture.Contains($term)){throw "Missing capture telemetry: $term"}
          }
          foreach($term in @('SharedFrameAgeMilliseconds','frame age session=')){
            if(-not $service.Contains($term)){throw "Missing Windows-service frame-age telemetry: $term"}
          }
          if(-not $clock.Contains('kQpcTimeTag')){throw 'Missing clock epoch marker'}
          foreach($term in @('MF_TRANSFORM_ASYNC','IMFMediaEventGenerator','MFT backpressure NOTACCEPTING')){
            if(-not $mft.Contains($term)){throw "Missing read-only MFT diagnostics: $term"}
          }
          if(-not $sender.Contains('process_env_max=')){throw 'Effective encoder environment log missing'}
          Write-Host 'QPC frame age and async-MFT state instrumentation verified'

      - name: Verify persistent GDI cache default-off and secure fallback continuity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent/src'
          $gdi=Get-Content (Join-Path $root 'platform/windows/windows_screen.cpp') -Raw
          $reuse=Get-Content (Join-Path $root 'gdi_surface_reuse_policy.h') -Raw
          foreach($k in @('HI5_GDI_PERSISTENT_DIB_CANARY','struct PersistentGdiDib','static thread_local PersistentGdiDib surface','surface.ensure','surface.reset','compositeCursorOnGdiSurface','SRCCOPY | CAPTUREBLT')){
            if(-not $gdi.Contains($k)){throw "Missing GDI cache or fallback safeguard: $k"}
          }
          if(-not $gdi.Contains('if (PersistentGdiCanaryEnabled())')){throw 'GDI persistent cache is not gated'}
          if(-not $gdi.Contains('HDC memDC = CreateCompatibleDC(screenDC)')){throw 'Known-good legacy GDI fallback missing'}
          if(-not $reuse.Contains('CanReuseGdiSurface')){throw 'Surface reuse invariant missing'}
          if(-not $gdi.Contains('enableGdiFallback("DuplicateOutput failed", hr)')){throw 'DXGI access-denied fallback missing'}
          Write-Host 'Persistent DIB cache default OFF, legacy GDI fallback intact, secure-capture baseline preserved'

      - name: Validate opt-in stage telemetry and unchanged capture fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content 'native/agent/Agent/chatpass_agent/src/platform/windows/windows_screen.cpp' -Raw
          $header=Get-Content 'native/agent/Agent/chatpass_agent/src/capture_stage_split.h' -Raw
          foreach($term in @('HI5_CAPTURE_STAGE_TIMING_CANARY','LogCaptureStageTiming','gdi_avg_ms=','i420_avg_ms=','persistent GDI blit failed err=','GetCurrentThreadId')){
            if(-not $src.Contains($term)){throw "Missing capture diagnosis: $term"}
          }
          if(-not $src.Contains('HDC memDC = CreateCompatibleDC(screenDC)')){throw 'Known-good GDI path replaced'}
          if(-not $src.Contains('if (PersistentGdiCanaryEnabled())')){throw 'Persistent DIB should remain opt-in'}
          if(-not $header.Contains('CaptureStageWindow')){throw 'Stage counter missing'}
          $codec=Get-Content 'native/agent/Agent/chatpass_agent/src/webrtc_sender.cpp' -Raw
          if(-not $codec.Contains('HI5_H264_FILTERED_SCALING_CANARY')){throw 'Previous video quality canary missing'}
          Write-Host 'Read-only capture-stage instrumentation, legacy fallback, and H264 quality gating verified'

      - name: Validate isolated BitBlt gating and no undefined pixels
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $capture=Get-Content (Join-Path $r 'platform/windows/windows_screen.cpp') -Raw
          $policy=Get-Content (Join-Path $r 'gdi_bitblt_policy.h') -Raw
          foreach($term in @('HI5_GDI_BITBLT_CANARY','hi5::CanUseBitBlt','copied = BitBlt(','copied = StretchBlt(','if (!copied)','gdi_blit window','LogBlitTiming')){
            if(-not $capture.Contains($term)){throw "Missing BitBlt fallback or bounded telemetry: $term"}
          }
          if(-not $policy.Contains('sourceW == destW && sourceH == destH')){throw 'BitBlt must be gated on exact same size'}
          if(-not $capture.Contains('if (PersistentGdiCanaryEnabled())')){throw 'Existing DIB experiment must remain opt-in'}
          if(-not $capture.Contains('if (useBitBlt)')){throw 'Legacy capture must be default'}
          Write-Host 'BitBlt default OFF, dimension gate, fallback and no-uninitialized-image gate PASS'

      - name: Run Windows GDI 2560x1600 synthetic DIB BitBlt comparison
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC unavailable'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $src='native/agent/Agent/chatpass_agent/tests/gdi_bitblt_win32_benchmark.cpp'
          $exe='dist\gdi_bitblt_win32_benchmark.exe'
          $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /O2 /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN '+$src+' /Fe:'+$exe+' /link user32.lib gdi32.lib && '+$exe
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'Windows GDI microbenchmark or pixel compare failed'}
          Write-Host 'Microbenchmark is synthetic only, NOT Lenovo desktop capture proof'

      - name: Verify SSE2 Y conversion opt-in and scalar fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $capture=Get-Content (Join-Path $r 'platform/windows/windows_screen.cpp') -Raw
          $simd=Get-Content (Join-Path $r 'bgra_luma_sse2.h') -Raw
          foreach($k in @('HI5_BGRA_Y_SSE2_CANARY','ShouldUseSse2Luma','BgraLumaRowSse2(row,','for (int x = 0; x < width; ++x)')){
            if(-not $capture.Contains($k)){throw "Missing SIMD gate or scalar fallback: $k"}
          }
          if(-not $simd.Contains('_mm_madd_epi16')){throw 'SSE2 multiply-add not compiled'}
          if(-not $simd.Contains('ScalarBgraY')){throw 'SSE2 tail scalar fallback missing'}
          if(-not $capture.Contains('HI5_GDI_BITBLT_CANARY')){throw 'Prior GDI canary must remain separately controlled'}
          Write-Host 'SSE2 Y path is optional and scalar YUV path remains default'

      - name: Verify original first UAC launch and gated secure-helper restart safety
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $service=Get-Content (Join-Path $r 'platform/windows/windows_service.cpp') -Raw
          $policy=Get-Content (Join-Path $r 'secure_helper_restart_policy.h') -Raw
          if(-not $service.Contains('HI5_SECURE_RELAUNCH_GUARD_CANARY')){throw 'Opt-in secure helper guard absent'}
          if(-not $service.Contains('lastSecureLaunchAttempt = {}')){throw 'Initial secure helper launch must be immediate'}
          if(-not $policy.Contains('!guardEnabled || !hadPriorAttempt')){throw 'Initial/legacy launch policy must remain instantaneous'}
          if(-not $policy.Contains('millisecondsSinceAttempt >= 500')){throw 'Bounded 500ms retry floor absent'}
          if(($service.Split('if (mayLaunchSecure(now))').Count - 1) -ne 2){throw 'Two security-critical launch sites not both gated'}
          if(-not $service.Contains('secure helper restart backoff session=')){throw 'Diagnostic telemetry missing'}
          if(-not $service.Contains('ShouldHoldSecureDesktop')){throw 'Secure frame preservation removed'}
          Write-Host 'No first-UAC delay, default OFF, both retry callsites and secure frame preservation validated'

      - name: Verify DXGI diagnostics default-off, no token or fallback changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r='native/agent/Agent/chatpass_agent/src'
          $capture=Get-Content (Join-Path $r 'platform/windows/windows_screen.cpp') -Raw
          $policy=Get-Content (Join-Path $r 'dxgi_context_policy.h') -Raw
          $service=Get-Content (Join-Path $r 'platform/windows/windows_service.cpp') -Raw
          foreach($k in @('HI5_DXGI_CONTEXT_DIAGNOSTICS_CANARY','ShouldLogDxgiFailure','LogDxgiFailureContext(hr','ProcessIdToSessionId','GetThreadDesktop','GetProcessWindowStation','OpenInputDesktop','CloseDesktop(input)','enableGdiFallback("DuplicateOutput failed", hr)')){
            if(-not $capture.Contains($k)){throw "DXGI context diagnostic or fallback missing: $k"}
          }
          if(-not $policy.Contains('return enabled && hr < 0')){throw 'DXGI diagnostics must be default off'}
          if($capture.Contains('SetThreadDesktop(')){throw 'Capture code must not switch desktop'}
          if($capture.Contains('DuplicateCurrentProcessPrimaryTokenForSession(')){throw 'Capture code must not modify tokens'}
          if(-not $service.Contains('HI5_SECURE_RELAUNCH_GUARD_CANARY')){throw 'Qualified 521 secure guard removed'}
          Write-Host 'DXGI diagnostics read-only and default off; GDI fallback and secure helper preserved'

      - name: Verify interactive-user DXGI probe isolation and qualified 521 source integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent'
          $main=Get-Content (Join-Path $root 'src/main.cpp') -Raw
          $probe=Get-Content (Join-Path $root 'src/dxgi_user_probe.h') -Raw
          $policy=Get-Content (Join-Path $root 'src/dxgi_user_probe_policy.h') -Raw
          $service=Join-Path $root 'src/platform/windows/windows_service.cpp'
          $capture=Join-Path $root 'src/platform/windows/windows_screen.cpp'
          $launcher=Join-Path $root 'src/ipc/session_launcher.cpp'
          if((Get-FileHash $service -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3e1127cdb503de624cce7725f19220b5d22442c55cf5543743ee55c9f4f37dc6'){throw 'Qualified secure desktop service was modified'}
          if((Get-FileHash $capture -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc7f702dc315aaa47023ab4b636da0d75a3e16d71dbdb8aaaa5f2b1e218791d3'){throw 'Qualified GDI/DXGI fallback was modified'}
          # Windows git checkout may use CRLF for baseline sources; compare the
          # launcher against the pinned commit, not OS-specific raw bytes.
          git diff --exit-code -- $launcher
          if($LASTEXITCODE -ne 0){throw 'Existing interactive launch token handling was modified'}
          $entry=$main.Substring($main.IndexOf('int main('))
          if($entry.IndexOf('if (mode == "dxgi-user-probe-child")') -lt 0 -or $entry.IndexOf('if (mode == "dxgi-user-probe-launcher")') -lt 0){throw 'Probe modes not reachable'}
          if($entry.IndexOf('RunInteractiveDxgiChild()') -gt $entry.IndexOf('LogPlatformInfo();')){throw 'Probe is starting screen providers before dispatch'}
          foreach($term in @('LaunchInInteractiveSession(','WTSGetActiveConsoleSessionId()','IsWellKnownSid(','GetThreadDesktop(','OpenInputDesktop(','D3D11CreateDevice(','DuplicateOutput(','WaitForSingleObject(child,8000)','TerminateProcess(child,','frame_bytes_read=0')){
            if(-not $probe.Contains($term)){throw "Missing safe user DXGI test: $term"}
          }
          if($probe.Contains('AcquireNextFrame(') -and -not $probe.Contains('without AcquireNextFrame')){throw 'Probe must not acquire pixels'}
          if($probe.Contains('SetThreadDesktop(') -or $probe.Contains('SetTokenInformation(')){throw 'Probe cannot change token or desktop'}
          if(-not $policy.Contains('!localSystem && consoleMatches && threadDefault')){throw 'User/session gate absent'}
          if(-not $policy.Contains('duplicate_output_access_denied')){throw 'Full DXGI access-denied status not classified'}
          $cmake=Get-Content (Join-Path $root 'CMakeLists.txt') -Raw
          foreach($lib in @('d3d11','dxgi','wtsapi32','user32','advapi32')){
            if(-not $cmake.Contains($lib)){throw "Required Win32 link library missing $lib"}
          }
          Write-Host 'Read-only short-lived interactive-user DXGI probe passes source, token, timeout and stable baseline controls'

      - name: Verify WGC event-driven probe isolation, Windows consent visibility, and secure GDI baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/agent/Agent/chatpass_agent'
          $main=Get-Content (Join-Path $root 'src/main.cpp') -Raw
          $wgc=Get-Content (Join-Path $root 'src/wgc_user_probe.h') -Raw
          $policy=Get-Content (Join-Path $root 'src/wgc_probe_policy.h') -Raw
          $cmake=Get-Content (Join-Path $root 'CMakeLists.txt') -Raw
          foreach($name in @('wgc-user-probe-launcher','wgc-user-probe-child')){
            if(-not $main.Contains($name)){throw "On-demand probe mode absent: $name"}
          }
          foreach($name in @('LaunchInInteractiveSession(','CanAttemptWgcMonitorProbe(','CreateForMonitor(','GraphicsCaptureSession::IsSupported()','D3D11CreateDevice(','CreateDirect3D11DeviceFromDXGIDevice(','CreateFreeThreaded(','FrameArrived(','StartCapture()','TryGetNextFrame()','frame_bytes_read','pixels_read=0','transmitted_frames=0','WaitForSingleObject(child,9000)','TerminateProcess(child,')){
            # Pixel read label is pixels_read, not frame_bytes_read
            if($name -eq 'frame_bytes_read'){continue}
            if(-not $wgc.Contains($name)){throw "WGC safety/capture event primitive absent: $name"}
          }
          # Exclude line comments: documentation may explicitly mention forbidden
          # calls to explain why they are not used. Inspect executable source.
          $wgcCode=($wgc -split "`n" | Where-Object {$_ -notmatch '^\s*//'}) -join "`n"
          foreach($name in @('frame.Surface(','GetDC(','AcquireNextFrame(','IsBorderRequired(false)','SetThreadDesktop(','SetTokenInformation(')){
            if($wgcCode.Contains($name)){throw "Prohibited WGC probe operation: $name"}
          }
          if(-not $policy.Contains('!localSystem&&sessionMatch&&threadDefault')){throw 'Interactive default desktop gate missing'}
          if(-not $cmake.Contains('windowsapp')){throw 'WinRT runtime import library missing'}
          if(-not $cmake.Contains('d3d11')){throw 'D3D11 link library missing'}
          $stable=Join-Path $root 'src/platform/windows/windows_service.cpp'
          if((Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3e1127cdb503de624cce7725f19220b5d22442c55cf5543743ee55c9f4f37dc6'){throw 'Qualified UAC secure-helper source changed'}
          $capture=Join-Path $root 'src/platform/windows/windows_screen.cpp'
          if((Get-FileHash $capture -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc7f702dc315aaa47023ab4b636da0d75a3e16d71dbdb8aaaa5f2b1e218791d3'){throw 'Qualified GDI fallback source changed'}
          git diff --exit-code -- (Join-Path $root 'src/ipc/session_launcher.cpp')
          if($LASTEXITCODE -ne 0){throw 'User token/desktop launcher modified'}
          Write-Host 'WGC diagnostic: normal user only, WinRT events, no pixel access, no consent bypass, secure/GDI paths unchanged'

      - name: Install native Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}
          nuget install Microsoft.Web.WebView2 -OutputDirectory native/agent/Agent/chatpass_agent/external -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'WebView2 NuGet installation failed'}
          $vcpkg='C:\vcpkg\vcpkg.exe'
          if(-not(Test-Path $vcpkg)){throw 'vcpkg unavailable'}
          & $vcpkg install openssl:x64-windows-static nlohmann-json:x64-windows-static libvpx:x64-windows-static 'libdatachannel[srtp,ws]:x64-windows-static'
          if($LASTEXITCODE -ne 0){throw 'WebRTC static dependency build failed'}

      - name: Build Agent 1.0.524 from same 510 source (test only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'Visual Studio MSVC unavailable'}
          $devcmd=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $vsVersion=& $vswhere -latest -products * -property installationVersion
          $generator=if($vsVersion -match '^18\.'){'Visual Studio 18 2026'}else{'Visual Studio 17 2022'}
          $script=(Resolve-Path 'native/agent/Agent/chatpass_agent/installer/windows/Build-AgentInstaller.ps1').Path
          $cmd='call "'+$devcmd+'" -arch=x64 -host_arch=x64 && powershell.exe -NoProfile -ExecutionPolicy Bypass -File "'+$script+'" -Clean -Generator "'+$generator+'" -Platform x64 -VcpkgRoot C:\vcpkg -VcpkgTriplet x64-windows-static -LibDataChannelRoot C:\vcpkg\installed\x64-windows-static -InnoSetupCompiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -AgentVersion "1.0.524"'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){throw 'Native diagnostic Agent build failed'}
          $exe='native/agent/Agent/chatpass_agent/dist/installer/Hi5CentralAgentSetup.exe'
          if(-not(Test-Path $exe)){throw 'Inno Setup installer missing'}
          $bytes=[IO.File]::ReadAllBytes($exe)
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a){throw 'Invalid Windows installer'}
          $dist='dist/lenovo-streaming-stage2k'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dist 'Hi5CentralAgentSetup-1.0.524-DIAGNOSTIC.exe')
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            diagnostic_only=$true
            no_automatic_deployment=$true
            target='Lenovo DESKTOP-Q9LTF1M'
            expected_installed_version='1.0.523'
            version='1.0.524'
            base_commit='2a121cf0f03f89c866599ad2aba07eea9e2536c7'
            source_package_sha256='476b8f00a19f6d83cb40968d62a64620fbc02074e59aad6794dbaecbadb3b0f3'
            new_installer_sha256=$hash
            new_installer_bytes=$bytes.Length
          }
          $manifest|ConvertTo-Json|Set-Content (Join-Path $dist 'manifest.json') -Encoding utf8
          $pdb=Get-ChildItem 'native/agent/Agent/chatpass_agent/build' -Recurse -Filter 'Hi5CentralAgent.pdb' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($pdb){Copy-Item -LiteralPath $pdb.FullName -Destination (Join-Path $dist 'Hi5CentralAgent-DIAGNOSTIC.pdb')}
          Write-Host "CANARY_AGENT_VERSION=1.0.524 SHA256=$hash"

      - name: Verify current 1.0.523 rollback SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://downloads.hi5central.com/rmm-agent/1.0.523-lenovo-stage2j/Hi5CentralAgentSetup.exe'
          $expected='296695feeaa13ed976ec86cb89e4fe5fc4837add977ce4ca3cdc48cb3942cf0e'
          $path='dist/lenovo-streaming-stage2k/Hi5CentralAgentSetup-1.0.523-ROLLBACK.exe'
          Invoke-WebRequest -Uri $url -OutFile $path
          $hash=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $expected){throw "Original 514 rollback installer hash mismatch $hash"}
          Write-Host 'Verified original 1.0.523 rollback installer against release manifest'
          $manifestPath='dist/lenovo-streaming-stage2k/manifest.json'
          $newPath='dist/lenovo-streaming-stage2k/Hi5CentralAgentSetup-1.0.524-DIAGNOSTIC.exe'
          $artifactRollback='dist/lenovo-streaming-stage2k/Hi5CentralAgentSetup-1.0.523-ROLLBACK.exe'
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if($manifest.version -ne '1.0.524' -or -not $manifest.diagnostic_only){throw 'Invalid test-only manifest version'}
          if(-not (Test-Path $newPath) -or -not (Test-Path $artifactRollback)){throw 'New or rollback installer absent from upload directory'}
          $newSha=(Get-FileHash -LiteralPath $newPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if($newSha -ne $manifest.new_installer_sha256){throw 'New installer checksum mismatch in final artifact directory'}
          $rollbackSha=(Get-FileHash -LiteralPath $artifactRollback -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rollbackSha -ne $expected){throw 'Rollback installer checksum mismatch in final artifact directory'}
          Write-Host "Final test-only artifact checksums verified; new=$newSha rollback=$rollbackSha"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hi5Central-Lenovo-Streaming-1.0.524-Stage2K-TEST-ONLY
          path: dist/lenovo-streaming-stage2k/
          retention-days: 14
          if-no-files-found: error
