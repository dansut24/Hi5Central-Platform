# Opt-in QA editorial bridge, not part of automatic tenant deployment.
# Deploy only after review with trusted Dev DB URL and operator credential
# stored as restricted host files; neither value is committed to GitHub.
services:
  qa-release-publication-relay:
    build:
      context: ../..
      dockerfile: deployment/qa26/Dockerfile.release-publication-relay
    image: hi5central-release-publication-relay:qa-scoped-v1
    container_name: hi5central-release-publication-relay
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    networks:
      - hi5central
      - hi5central-dev_hi5internal
    environment:
      DEV_DATABASE_URL_FILE: /run/secrets/qa_dev_db
      RELEASE_PUBLICATION_TOKEN_FILE: /run/secrets/qa_publication_token
      CENTRAL_RELEASE_AUTHORITY_URL: http://hi5central-api:3001
      # Only the Dev build verified through live HTTPS is eligible. The Live
      # API must ALSO have independently reviewed automatic mode enabled
      # and verify official five-job GitHub release CI before publishing.
      RELEASE_PUBLICATION_ALLOWED_SHA: verified-dev
      RELEASE_PUBLICATION_AUTOMATIC: 'true'
    secrets:
      - qa_dev_db
      - qa_publication_token
secrets:
  qa_dev_db:
    file: ${QA_RELEASE_DEV_DB_SECRET_FILE:?Provide a restricted host file with the Dev PostgreSQL URL}
  qa_publication_token:
    file: ${QA_RELEASE_PUBLICATION_TOKEN_SECRET_FILE:?Provide the new dedicated publication-only bearer file}
networks:
  hi5central:
    external: true
  hi5central-dev_hi5internal:
    external: true
