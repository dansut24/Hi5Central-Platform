name: Hi5CentralRMM
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
options:
  bundleIdPrefix: com.hi5central
  deploymentTarget:
    iOS: "16.0"
targets:
  Hi5CentralRMM:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    dependencies:
      - package: WebRTC
      - target: Hi5RemoteActivity
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Hi5Central RMM"
        CFBundleShortVersionString: "0.5.16"
        CFBundleVersion: "21"
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - hi5central-rmm
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Camera access may be used for attended support sessions when you choose to share video."
        NSMicrophoneUsageDescription: "Microphone access may be used for attended support sessions when you choose to enable it."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hi5central.rmm
        PRODUCT_NAME: Hi5CentralRMM
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
  Hi5RemoteActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: LiveActivity
        excludes:
          - Info.plist
      - path: Sources/RemoteSessionAttributes.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: "Hi5Central Session"
        CFBundleShortVersionString: "0.5.16"
        CFBundleVersion: "21"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hi5central.rmm.activity
        PRODUCT_NAME: Hi5RemoteActivity
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Hi5CentralRMM:
    build:
      targets:
        Hi5CentralRMM: all
    run:
      config: Debug
    archive:
      config: Release
