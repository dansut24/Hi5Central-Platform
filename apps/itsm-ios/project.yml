name: Hi5CentralITSM
options:
  bundleIdPrefix: com.hi5central
  deploymentTarget:
    iOS: "16.0"
targets:
  Hi5CentralITSM:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Hi5Central ITSM"
        UILaunchStoryboardName: LaunchScreen
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hi5central.itsm
        PRODUCT_NAME: Hi5CentralITSM
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
schemes:
  Hi5CentralITSM:
    build:
      targets:
        Hi5CentralITSM: all
    run:
      config: Debug
    archive:
      config: Release
