name: Hi5CentralMobile
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
options:
  bundleIdPrefix: com.hi5central
  deploymentTarget:
    iOS: "16.0"
targets:
  Hi5CentralMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: ../itsm-ios/Sources
        excludes:
          - Info.plist
          - LaunchScreen.storyboard
      - path: ../rmm-ios/Sources
        excludes:
          - Info.plist
          - LaunchScreen.storyboard
          - Assets.xcassets
    dependencies:
      - package: WebRTC
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Hi5Central"
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "5"
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - hi5central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Unlock the Hi5Central app with Face ID when app lock is enabled."
        NSCameraUsageDescription: "Camera access may be used when you choose attended remote support."
        NSMicrophoneUsageDescription: "Microphone access may be used when you enable it during remote support."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hi5central.mobile
        PRODUCT_NAME: Hi5CentralMobile
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "HI5CENTRAL_UNIFIED"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  Hi5CentralMobile:
    build:
      targets:
        Hi5CentralMobile: all
    run:
      config: Debug
    archive:
      config: Release
