name: ${COMPOSE_PROJECT_NAME:-hi5central-local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hi5central}
      POSTGRES_USER: ${POSTGRES_USER:-hi5central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hi5central-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hi5central} -d ${POSTGRES_DB:-hi5central}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"

  migrate:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hi5central}:${POSTGRES_PASSWORD:-hi5central-local-only}@postgres:5432/${POSTGRES_DB:-hi5central}
    volumes:
      - ../services/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - apk add --no-cache binutils coreutils dpkg file findutils grep rpm tar >/dev/null && npm ci && node --watch src/index.js
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hi5central}:${POSTGRES_PASSWORD:-hi5central-local-only}@postgres:5432/${POSTGRES_DB:-hi5central}
      REDIS_URL: redis://redis:6379
      DEPLOYMENT_MODE: managed
      TENANCY_MODE: single
      RUNTIME_ENVIRONMENT: dev
      FEATURE_MODE: all_enabled
      ROOT_DOMAIN: ${DEV_HOST:-localhost}
      PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG:-local}
      APP_URL: http://${DEV_HOST:-localhost}:3000
      API_URL: http://${DEV_HOST:-localhost}:3001
      PORTAL_URL: http://${DEV_HOST:-localhost}:3000/portal
      RMM_URL: http://${DEV_HOST:-localhost}:3002
      ADMIN_URL: http://${DEV_HOST:-localhost}:3003
      MARKETING_URL: http://${DEV_HOST:-localhost}:3000
      COOKIE_DOMAIN: ""
      BACKGROUND_WORKERS_ENABLED: ${BACKGROUND_WORKERS_ENABLED:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ${SMTP_USER:-local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-local}
      SMTP_FROM: Hi5Central Local <local@hi5central.test>
    ports:
      - "3001:3001"
    volumes:
      - ../services/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  itsm:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEPLOYMENT_MODE: managed
      VITE_TENANCY_MODE: single
      VITE_RUNTIME_ENVIRONMENT: dev
      VITE_FEATURE_MODE: all_enabled
      VITE_ROOT_DOMAIN: ${DEV_HOST:-localhost}
      VITE_PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG:-local}
      VITE_APP_URL: http://${DEV_HOST:-localhost}:3000
      VITE_API_URL: http://${DEV_HOST:-localhost}:3001
      VITE_PORTAL_URL: http://${DEV_HOST:-localhost}:3000/portal
      VITE_RMM_URL: http://${DEV_HOST:-localhost}:3002
      VITE_ADMIN_URL: http://${DEV_HOST:-localhost}:3003
      VITE_MARKETING_URL: http://${DEV_HOST:-localhost}:3000
    ports:
      - "3000:5173"
    volumes:
      - ../apps/itsm:/app
      - itsm_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  rmm:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEPLOYMENT_MODE: managed
      VITE_TENANCY_MODE: single
      VITE_RUNTIME_ENVIRONMENT: dev
      VITE_FEATURE_MODE: all_enabled
      VITE_ROOT_DOMAIN: ${DEV_HOST:-localhost}
      VITE_PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG:-local}
      VITE_APP_URL: http://${DEV_HOST:-localhost}:3000
      VITE_API_URL: http://${DEV_HOST:-localhost}:3001
      VITE_PORTAL_URL: http://${DEV_HOST:-localhost}:3000/portal
      VITE_RMM_URL: http://${DEV_HOST:-localhost}:3002
      VITE_ADMIN_URL: http://${DEV_HOST:-localhost}:3003
      VITE_DOWNLOADS_URL: http://${DEV_HOST:-localhost}:3001
      VITE_MARKETING_URL: http://${DEV_HOST:-localhost}:3000
    ports:
      - "3002:5173"
    volumes:
      - ../apps/rmm:/app
      - rmm_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  admin:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEPLOYMENT_MODE: managed
      VITE_TENANCY_MODE: single
      VITE_RUNTIME_ENVIRONMENT: dev
      VITE_FEATURE_MODE: all_enabled
      VITE_ROOT_DOMAIN: ${DEV_HOST:-localhost}
      VITE_PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG:-local}
      VITE_APP_URL: http://${DEV_HOST:-localhost}:3000
      VITE_API_URL: http://${DEV_HOST:-localhost}:3001
      VITE_PORTAL_URL: http://${DEV_HOST:-localhost}:3000/portal
      VITE_RMM_URL: http://${DEV_HOST:-localhost}:3002
      VITE_ADMIN_URL: http://${DEV_HOST:-localhost}:3003
      VITE_MARKETING_URL: http://${DEV_HOST:-localhost}:3000
    ports:
      - "3003:5173"
    volumes:
      - ../apps/admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  itsm_node_modules:
  rmm_node_modules:
  admin_node_modules:
